  <script>
// === MODULE: lib/estimator.js ===
/**
 * HelioStudio — Isolated Deterministic Solar, Battery & Financial Estimator
 * All calculations use explicit units and decimal-safe integer minor units (1/100th of currency).
 */

(function (root, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory();
  } else {
    root.HelioEstimator = factory();
  }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const DEFAULT_ASSUMPTIONS = {
    currency: 'PKR',
    locale: 'en-PK',
    timezone: 'Asia/Karachi',
    regionLabel: 'Islamabad / Rawalpindi Metro (Demo Region)',
    daysInMonth: 30,
    peakSunHoursPerDay: 4.8,
    performanceFactor: 0.80,
    assumedTariffPerKwh: 45,
    exportCreditPerKwh: 19,
    selfConsumptionGridTied: 0.65,
    selfConsumptionBattery: 0.85,
    usableDodFraction: 0.90,
    batteryEfficiencyFraction: 0.92,
    minDcAcRatio: 0.80,
    maxDcAcRatio: 1.35,
    minPanels: 4,
    maxPanels: 80,
    maxVisiblePanels: 36,
    minMonthlyKwh: 50,
    maxMonthlyKwh: 50000,
    defaultInstallationPerKw: 18000,
    defaultFixedInstallation: 45000,
    defaultBosAllowance: 35000,
    defaultDiscountPercent: 0,
    defaultTaxRatePercent: 0,
    discountTiming: 'before_tax', // 'before_tax' | 'after_tax'
    annualDegradationPercent: 0.5,
    systemLifeYears: 25,
    proposalFollowUpDays: 3,
    disclaimerText: 'Preliminary estimate — subject to physical site assessment, structural roof review, shading analysis, and professional electrical engineering design. Displayed energy generation and payback figures are illustrative and do not guarantee real-world output or utility bill savings.',
    proposalFooterText: 'SunGrid Energy (Demo Workspace) • Preliminary Solar & Storage Proposal • Prices valid until expiry date subject to on-site technical survey.'
  };

  /**
   * Convert major currency units to integer minor units (e.g. PKR -> paisas, USD -> cents)
   */
  function toMinorUnits(amountMajor) {
    const num = Number(amountMajor);
    if (!Number.isFinite(num)) return 0;
    return Math.round(num * 100);
  }

  /**
   * Convert integer minor units back to rounded major units (2 decimal places max)
   */
  function fromMinorUnits(amountMinor) {
    const num = Number(amountMinor);
    if (!Number.isFinite(num)) return 0;
    return Math.round(num) / 100;
  }

  /**
   * Clamp a numeric value safely between min and max
   */
  function clampNumber(val, min, max, fallback) {
    const num = Number(val);
    if (!Number.isFinite(num)) return fallback;
    return Math.min(max, Math.max(min, num));
  }

  /**
   * Format currency cleanly using locale and currency settings
   */
  function formatMoney(amountMajor, currency = 'PKR', locale = 'en-PK') {
    const safeAmount = Number.isFinite(Number(amountMajor)) ? Number(amountMajor) : 0;
    try {
      const hasFraction = Math.abs(safeAmount - Math.round(safeAmount)) > 0.005;
      return new Intl.NumberFormat(locale || 'en-PK', {
        style: 'currency',
        currency: currency || 'PKR',
        minimumFractionDigits: hasFraction ? 2 : 0,
        maximumFractionDigits: hasFraction ? 2 : 0
      }).format(safeAmount);
    } catch (e) {
      return (currency || 'PKR') + ' ' + Math.round(safeAmount).toLocaleString();
    }
  }

  /**
   * Step 7.1: Calculate daily energy demand and preliminary DC system target in kW
   */
  function calculateEnergyAndTargetKw(input, assumptionsInput) {
    const a = Object.assign({}, DEFAULT_ASSUMPTIONS, assumptionsInput || {});
    const daysInMonth = clampNumber(a.daysInMonth, 28, 31, 30);
    const peakSunHours = clampNumber(a.peakSunHoursPerDay, 1.0, 10.0, 4.8);
    const perfFactor = clampNumber(a.performanceFactor, 0.40, 0.95, 0.80);
    const tariff = clampNumber(
      input && input.customTariffPerKwh !== undefined ? input.customTariffPerKwh : a.assumedTariffPerKwh,
      1,
      10000,
      45
    );

    const mode = (input && input.energyInputMode) || 'kwh'; // 'kwh' | 'bill' | 'demo_profile'
    let monthlyKwh = 0;
    let rawMonthlyBill = 0;
    const warnings = [];

    if (mode === 'bill') {
      const billVal = Number(input && input.monthlyBillAmount);
      if (!Number.isFinite(billVal) || billVal <= 0) {
        rawMonthlyBill = 0;
        monthlyKwh = 0;
        warnings.push('Enter a positive monthly bill amount to estimate consumption.');
      } else {
        rawMonthlyBill = Math.min(billVal, 100000000);
        monthlyKwh = rawMonthlyBill / tariff;
      }
    } else if (mode === 'demo_profile') {
      const profileKey = (input && input.demoProfileKey) || 'home';
      const profiles = {
        home: 900,
        small_business: 1650,
        home_backup: 1100
      };
      monthlyKwh = profiles[profileKey] || 900;
      rawMonthlyBill = monthlyKwh * tariff;
    } else {
      const kwhVal = Number(input && input.monthlyKwh);
      if (!Number.isFinite(kwhVal) || kwhVal <= 0) {
        monthlyKwh = 0;
        warnings.push('Enter a positive monthly kWh consumption value.');
      } else {
        monthlyKwh = clampNumber(kwhVal, 0, a.maxMonthlyKwh * 2, 0);
        if (kwhVal > a.maxMonthlyKwh) {
          warnings.push(`Monthly consumption exceeds standard configurator bound (${a.maxMonthlyKwh.toLocaleString()} kWh). Capped for preliminary sizing.`);
          monthlyKwh = a.maxMonthlyKwh;
        }
      }
      rawMonthlyBill = monthlyKwh * tariff;
    }

    const dailyEnergyKwh = monthlyKwh > 0 ? monthlyKwh / daysInMonth : 0;
    const effectiveYieldPerKwDay = peakSunHours * perfFactor;
    const preliminaryDcTargetKw = effectiveYieldPerKwDay > 0 ? dailyEnergyKwh / effectiveYieldPerKwDay : 0;

    return {
      energyInputMode: mode,
      monthlyKwh: Math.round(monthlyKwh * 10) / 10,
      rawMonthlyBill: Math.round(rawMonthlyBill),
      assumedTariffPerKwh: tariff,
      daysInMonth,
      dailyEnergyKwh: Math.round(dailyEnergyKwh * 100) / 100,
      peakSunHoursPerDay: peakSunHours,
      performanceFactor: perfFactor,
      preliminaryDcTargetKw: Math.round(preliminaryDcTargetKw * 100) / 100,
      warnings
    };
  }

  /**
   * Step 7.2: Panel and Inverter Sizing
   */
  function calculatePanelAndInverterSizing(params) {
    const a = Object.assign({}, DEFAULT_ASSUMPTIONS, (params && params.assumptions) || {});
    const targetKw = Math.max(0, Number(params && params.preliminaryDcTargetKw) || 0);
    const panelProduct = (params && params.panelProduct) || { wattage: 580, name: '580W Bifacial Module' };
    const inverterProduct = (params && params.inverterProduct) || { acCapacityKw: 8, inverterType: 'hybrid', name: '8kW Hybrid Inverter' };
    const panelWattage = clampNumber(panelProduct && panelProduct.wattage, 100, 1200, 580);
    const inverterAcKw = clampNumber(inverterProduct && inverterProduct.acCapacityKw, 1, 250, 8);
    const includeBattery = Boolean(params && params.includeBattery);

    const minPanels = clampNumber(a.minPanels, 1, 50, 4);
    const maxPanels = clampNumber(a.maxPanels, minPanels, 500, 80);
    const maxVisiblePanels = clampNumber(a.maxVisiblePanels, 4, 100, 36);

    // Recommended panel quantity from target kW: ceiling(preliminary DC target kW / (panel wattage / 1000))
    const rawRecommendedPanels = targetKw > 0
      ? Math.ceil(targetKw / (panelWattage / 1000))
      : minPanels;

    const recommendedPanelCount = clampNumber(rawRecommendedPanels, minPanels, maxPanels, minPanels);

    let selectedPanelCount = recommendedPanelCount;
    if (params && params.manualPanelCount !== undefined && params.manualPanelCount !== null && params.manualPanelCount !== '') {
      const manual = Number(params.manualPanelCount);
      if (Number.isFinite(manual) && manual > 0) {
        selectedPanelCount = clampNumber(Math.round(manual), minPanels, maxPanels, recommendedPanelCount);
      }
    }

    const actualDcCapacityKw = Math.round(((selectedPanelCount * panelWattage) / 1000) * 100) / 100;
    const visiblePanelCount = Math.min(selectedPanelCount, maxVisiblePanels);
    const isVisualizationCapped = selectedPanelCount > maxVisiblePanels;

    // Inverter quantity or ratio check
    const inverterQuantity = clampNumber(params && params.inverterQuantity, 1, 10, 1);
    const totalInverterAcKw = Math.round(inverterAcKw * inverterQuantity * 100) / 100;
    const dcAcRatio = totalInverterAcKw > 0 ? Math.round((actualDcCapacityKw / totalInverterAcKw) * 100) / 100 : 0;

    const compatibilityWarnings = [];
    if (dcAcRatio > a.maxDcAcRatio) {
      compatibilityWarnings.push(
        `Preliminary DC/AC ratio (${dcAcRatio.toFixed(2)}) exceeds typical upper guideline (${a.maxDcAcRatio.toFixed(2)}). Consider a higher-capacity inverter or fewer panels during professional review.`
      );
    } else if (dcAcRatio > 0 && dcAcRatio < a.minDcAcRatio) {
      compatibilityWarnings.push(
        `Preliminary DC/AC ratio (${dcAcRatio.toFixed(2)}) is below typical guideline (${a.minDcAcRatio.toFixed(2)}). The inverter is oversized relative to the current array.`
      );
    }

    if (includeBattery && inverterProduct && inverterProduct.inverterType === 'grid_tied') {
      compatibilityWarnings.push(
        `Battery storage is selected with a Grid-Tied inverter (${inverterProduct.name}). A Hybrid inverter or AC-coupled battery controller is required for backup operation.`
      );
    }

    if (isVisualizationCapped) {
      compatibilityWarnings.push(
        `3D roof preview caps displayed modules at ${maxVisiblePanels} panels for visual clarity, while the commercial estimate prices all ${selectedPanelCount} panels (${actualDcCapacityKw} kW DC).`
      );
    }

    const estimatedDailyGenerationKwh = Math.round(
      actualDcCapacityKw * a.peakSunHoursPerDay * a.performanceFactor * 10
    ) / 10;
    const estimatedMonthlyGenerationKwh = Math.round(estimatedDailyGenerationKwh * a.daysInMonth);

    return {
      panelWattage,
      rawRecommendedPanels,
      recommendedPanelCount,
      selectedPanelCount,
      visiblePanelCount,
      maxVisiblePanels,
      isVisualizationCapped,
      actualDcCapacityKw,
      inverterAcKw,
      inverterQuantity,
      totalInverterAcKw,
      dcAcRatio,
      estimatedDailyGenerationKwh,
      estimatedMonthlyGenerationKwh,
      compatibilityWarnings
    };
  }

  /**
   * Step 7.3: Battery Sizing Estimate
   */
  function calculateBatteryEstimate(params) {
    const a = Object.assign({}, DEFAULT_ASSUMPTIONS, (params && params.assumptions) || {});
    const includeBattery = Boolean(params && params.includeBattery);
    if (!includeBattery) {
      return {
        includeBattery: false,
        backupLoadKw: 0,
        targetRuntimeHours: 0,
        requiredNominalCapacityKwh: 0,
        usableDodFraction: a.usableDodFraction,
        batteryEfficiencyFraction: a.batteryEfficiencyFraction,
        batteryUnitCapacityKwh: 0,
        recommendedBatteryQuantity: 0,
        selectedBatteryQuantity: 0,
        totalNominalCapacityKwh: 0,
        totalUsableCapacityKwh: 0,
        estimatedRuntimeHours: 0,
        limitationsNote: 'No battery storage included. Grid-tied systems shut down automatically during grid outages for safety (anti-islanding).'
      };
    }

    const backupLoadKw = clampNumber(params && params.backupLoadKw, 0.2, 50, 1.8);
    const targetRuntimeHours = clampNumber(params && params.targetRuntimeHours, 1, 48, 4);
    const dod = clampNumber(a.usableDodFraction, 0.5, 1.0, 0.90);
    const eff = clampNumber(a.batteryEfficiencyFraction, 0.6, 1.0, 0.92);

    // Formula from Section 7.3:
    // required load power (kW) * desired runtime (hours) / (usable DoD * system efficiency)
    const requiredNominalCapacityKwh = Math.round(((backupLoadKw * targetRuntimeHours) / (dod * eff)) * 100) / 100;

    const batteryProduct = (params && params.batteryProduct) || { capacityKwh: 5.12, name: '5.12 kWh LFP Battery' };
    const unitCapacityKwh = clampNumber(batteryProduct && batteryProduct.capacityKwh, 1.0, 100.0, 5.12);

    const recommendedBatteryQuantity = clampNumber(
      Math.ceil(requiredNominalCapacityKwh / unitCapacityKwh),
      1,
      12,
      1
    );

    let selectedBatteryQuantity = recommendedBatteryQuantity;
    if (params && params.manualBatteryQuantity !== undefined && params.manualBatteryQuantity !== null && params.manualBatteryQuantity !== '') {
      const manualQty = Number(params.manualBatteryQuantity);
      if (Number.isFinite(manualQty) && manualQty >= 1) {
        selectedBatteryQuantity = clampNumber(Math.round(manualQty), 1, 12, recommendedBatteryQuantity);
      }
    }

    const totalNominalCapacityKwh = Math.round(selectedBatteryQuantity * unitCapacityKwh * 100) / 100;
    const totalUsableCapacityKwh = Math.round(totalNominalCapacityKwh * dod * eff * 100) / 100;
    const estimatedRuntimeHours = backupLoadKw > 0
      ? Math.round((totalUsableCapacityKwh / backupLoadKw) * 10) / 10
      : 0;

    return {
      includeBattery: true,
      backupLoadKw,
      targetRuntimeHours,
      requiredNominalCapacityKwh,
      usableDodFraction: dod,
      batteryEfficiencyFraction: eff,
      batteryUnitCapacityKwh: unitCapacityKwh,
      recommendedBatteryQuantity,
      selectedBatteryQuantity,
      totalNominalCapacityKwh,
      totalUsableCapacityKwh,
      estimatedRuntimeHours,
      limitationsNote: `Assumes ${backupLoadKw} kW continuous essential load (~${estimatedRuntimeHours} hrs runtime from ${totalUsableCapacityKwh} kWh usable / ${totalNominalCapacityKwh} kWh nominal capacity at ${Math.round(dod * 100)}% DoD & ${Math.round(eff * 100)}% efficiency). Does not support whole-home heavy AC/heating loads unless sized accordingly.`
    };
  }

  /**
   * Step 7.4: Decimal-safe Cost & Margin Calculation
   */
  function calculateFinancialTotals(params) {
    const a = Object.assign({}, DEFAULT_ASSUMPTIONS, (params && params.assumptions) || {});
    const rawLineItems = Array.isArray(params && params.lineItems) ? params.lineItems : [];

    const computedLines = rawLineItems.map((item, idx) => {
      const qty = Math.max(0, Math.round(Number(item.quantity) || 0));
      const unitPriceMajor = Math.max(0, Number(item.unitPrice) || 0);
      const unitCostMajor = Math.max(0, Number(item.unitCost !== undefined ? item.unitCost : unitPriceMajor * 0.78) || 0);

      const unitPriceMinor = toMinorUnits(unitPriceMajor);
      const unitCostMinor = toMinorUnits(unitCostMajor);
      const lineTotalMinor = qty * unitPriceMinor;
      const lineCostMinor = qty * unitCostMinor;

      return {
        id: item.id || `line_${idx + 1}`,
        productId: item.productId || null,
        sku: item.sku || `ITEM-${idx + 1}`,
        name: item.name || 'Equipment / Service Item',
        category: item.category || 'other',
        description: item.description || '',
        warrantyText: item.warrantyText || '',
        quantity: qty,
        unitPrice: fromMinorUnits(unitPriceMinor),
        unitCost: fromMinorUnits(unitCostMinor),
        lineTotal: fromMinorUnits(lineTotalMinor),
        lineCost: fromMinorUnits(lineCostMinor),
        _lineTotalMinor: lineTotalMinor,
        _lineCostMinor: lineCostMinor
      };
    }).filter(line => line.quantity > 0);

    const equipmentSubtotalMinor = computedLines
      .filter(l => l.category !== 'labor' && l.category !== 'service')
      .reduce((acc, l) => acc + l._lineTotalMinor, 0);

    const catalogLaborMinor = computedLines
      .filter(l => l.category === 'labor' || l.category === 'service')
      .reduce((acc, l) => acc + l._lineTotalMinor, 0);

    const extraInstallationMajor = params && params.installationAllowance !== undefined
      ? Math.max(0, Number(params.installationAllowance) || 0)
      : 0;
    const extraOtherChargesMajor = params && params.otherCharges !== undefined
      ? Math.max(0, Number(params.otherCharges) || 0)
      : 0;

    const installationLaborMinor = catalogLaborMinor + toMinorUnits(extraInstallationMajor);
    const otherChargesMinor = toMinorUnits(extraOtherChargesMajor);

    const grossSubtotalMinor = equipmentSubtotalMinor + installationLaborMinor + otherChargesMinor;
    const totalInternalCostMinor = computedLines.reduce((acc, l) => acc + l._lineCostMinor, 0) +
      Math.round(toMinorUnits(extraInstallationMajor + extraOtherChargesMajor) * 0.75);

    // Discount calculation
    const discountPercent = clampNumber(
      params && params.discountPercent !== undefined ? params.discountPercent : a.defaultDiscountPercent,
      0,
      100,
      0
    );
    const fixedDiscountMajor = Math.max(0, Number(params && params.discountAmount) || 0);
    const discountFromPercentMinor = Math.round(grossSubtotalMinor * (discountPercent / 100));
    const requestedDiscountMinor = fixedDiscountMajor > 0 ? toMinorUnits(fixedDiscountMajor) : discountFromPercentMinor;

    const discountTiming = (params && params.discountTiming) || a.discountTiming || 'before_tax';
    const taxRatePercent = clampNumber(
      params && params.taxRatePercent !== undefined ? params.taxRatePercent : a.defaultTaxRatePercent,
      0,
      100,
      0
    );

    let discountMinor = 0;
    let taxableAmountMinor = 0;
    let taxMinor = 0;
    let grandTotalMinor = 0;

    if (discountTiming === 'after_tax') {
      taxableAmountMinor = grossSubtotalMinor;
      taxMinor = Math.round(taxableAmountMinor * (taxRatePercent / 100));
      const preDiscountTotalMinor = grossSubtotalMinor + taxMinor;
      discountMinor = Math.min(preDiscountTotalMinor, requestedDiscountMinor);
      grandTotalMinor = Math.max(0, preDiscountTotalMinor - discountMinor);
    } else {
      // Default: 'before_tax'
      discountMinor = Math.min(grossSubtotalMinor, requestedDiscountMinor);
      taxableAmountMinor = Math.max(0, grossSubtotalMinor - discountMinor);
      taxMinor = Math.round(taxableAmountMinor * (taxRatePercent / 100));
      grandTotalMinor = taxableAmountMinor + taxMinor;
    }

    const amountPaidMajor = Math.max(0, Number(params && params.amountPaid) || 0);
    const amountPaidMinor = Math.min(grandTotalMinor, toMinorUnits(amountPaidMajor));
    const balanceDueMinor = Math.max(0, grandTotalMinor - amountPaidMinor);

    const netRevenueBeforeTaxMinor = Math.max(0, grossSubtotalMinor - discountMinor);
    const estimatedGrossMarginMinor = netRevenueBeforeTaxMinor - totalInternalCostMinor;
    const estimatedGrossMarginPercent = netRevenueBeforeTaxMinor > 0
      ? Math.round((estimatedGrossMarginMinor / netRevenueBeforeTaxMinor) * 1000) / 10
      : 0;

    // Strip internal minor fields for clean public output while preserving exact major values
    const cleanLines = computedLines.map(l => ({
      id: l.id,
      productId: l.productId,
      sku: l.sku,
      name: l.name,
      category: l.category,
      description: l.description,
      warrantyText: l.warrantyText,
      quantity: l.quantity,
      unitPrice: l.unitPrice,
      unitCost: l.unitCost,
      lineTotal: l.lineTotal,
      lineCost: l.lineCost
    }));

    return {
      currency: a.currency || 'PKR',
      lineItems: cleanLines,
      equipmentSubtotal: fromMinorUnits(equipmentSubtotalMinor),
      installationLabor: fromMinorUnits(installationLaborMinor),
      otherCharges: fromMinorUnits(otherChargesMinor),
      grossSubtotal: fromMinorUnits(grossSubtotalMinor),
      discountPercent,
      discountTiming,
      discountAmount: fromMinorUnits(discountMinor),
      taxableAmount: fromMinorUnits(taxableAmountMinor),
      taxRatePercent,
      taxAmount: fromMinorUnits(taxMinor),
      grandTotal: fromMinorUnits(grandTotalMinor),
      amountPaid: fromMinorUnits(amountPaidMinor),
      balanceDue: fromMinorUnits(balanceDueMinor),
      estimatedInternalCost: fromMinorUnits(totalInternalCostMinor),
      estimatedGrossMargin: fromMinorUnits(estimatedGrossMarginMinor),
      estimatedGrossMarginPercent
    };
  }

  /**
   * Step 7.5: Illustrative Savings and Payback (only if inputs are present)
   */
  function calculateIllustrativePayback(params) {
    const a = Object.assign({}, DEFAULT_ASSUMPTIONS, (params && params.assumptions) || {});
    const monthlyGenerationKwh = Number(params && params.estimatedMonthlyGenerationKwh) || 0;
    const monthlyConsumptionKwh = Number(params && params.monthlyKwh) || 0;
    const grandTotal = Number(params && params.grandTotal) || 0;
    const includeBattery = Boolean(params && params.includeBattery);

    if (monthlyGenerationKwh <= 0 || monthlyConsumptionKwh <= 0 || grandTotal <= 0) {
      return {
        available: false,
        reason: 'Enter monthly electricity consumption or bill details to view illustrative bill offset and payback.',
        selfConsumptionFraction: 0,
        assumedTariffPerKwh: a.assumedTariffPerKwh,
        exportCreditPerKwh: a.exportCreditPerKwh,
        estimatedMonthlyValue: 0,
        estimatedAnnualValue: 0,
        illustrativePaybackYears: null
      };
    }

    const selfConsumptionFraction = includeBattery
      ? clampNumber(a.selfConsumptionBattery, 0.2, 0.98, 0.85)
      : clampNumber(a.selfConsumptionGridTied, 0.2, 0.95, 0.65);

    const tariff = clampNumber(params.assumedTariffPerKwh || a.assumedTariffPerKwh, 1, 10000, 45);
    const exportRate = clampNumber(a.exportCreditPerKwh, 0, tariff, 19);

    const selfConsumedKwh = Math.min(monthlyConsumptionKwh, monthlyGenerationKwh * selfConsumptionFraction);
    const exportedKwh = Math.max(0, monthlyGenerationKwh - selfConsumedKwh);

    const monthlyValue = (selfConsumedKwh * tariff) + (exportedKwh * exportRate);
    const annualValue = monthlyValue * 12;
    const paybackYears = annualValue > 0 ? Math.round((grandTotal / annualValue) * 10) / 10 : null;

    return {
      available: true,
      selfConsumptionFraction,
      assumedTariffPerKwh: tariff,
      exportCreditPerKwh: exportRate,
      annualDegradationPercent: a.annualDegradationPercent,
      systemLifeYears: a.systemLifeYears,
      estimatedMonthlyValue: Math.round(monthlyValue),
      estimatedAnnualValue: Math.round(annualValue),
      illustrativePaybackYears: paybackYears,
      disclaimer: 'Illustrative simple payback based on static tariff & self-consumption assumptions. Not a financial guarantee.'
    };
  }

  /**
   * Validate Quote Request Form Inputs (Section 6.6 & 11.2)
   */
  function validateQuoteRequest(form) {
    const errors = {};
    const name = String((form && form.contactName) || '').trim();
    const email = String((form && form.email) || '').trim();
    const phone = String((form && form.phone) || '').trim();
    const city = String((form && form.city) || '').trim();
    const preferredMethod = String((form && form.preferredContactMethod) || 'phone').trim();
    const consent = Boolean(form && form.consentAccepted);

    if (!name || name.length < 2) {
      errors.contactName = 'Please enter your full name (at least 2 characters).';
    } else if (name.length > 100) {
      errors.contactName = 'Name must be under 100 characters.';
    }

    const hasValidEmail = email.length > 0 && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    const hasValidPhone = phone.length > 0 && /^[+\d\s\-()]{7,20}$/.test(phone);

    if (!email && !phone) {
      errors.contact = 'Please provide at least an email address or a phone number.';
    } else {
      if (email && !hasValidEmail) {
        errors.email = 'Please enter a valid email address (e.g. name@example.com).';
      }
      if (phone && !hasValidPhone) {
        errors.phone = 'Please enter a valid phone number (7–20 digits).';
      }
    }

    if (preferredMethod === 'email' && !hasValidEmail) {
      errors.email = 'An email address is required when Email is selected as your preferred contact method.';
    }
    if ((preferredMethod === 'phone' || preferredMethod === 'whatsapp') && !hasValidPhone) {
      errors.phone = 'A valid phone number is required when Phone/WhatsApp is selected as your preferred contact method.';
    }

    if (!city || city.length < 2) {
      errors.city = 'Please enter your city or service area.';
    }

    if (!consent) {
      errors.consentAccepted = 'Please acknowledge that this is a preliminary estimate and consent to follow-up.';
    }

    return {
      valid: Object.keys(errors).length === 0,
      errors
    };
  }

   * Validate Lead & Proposal Status Transitions (Section 8.2 & 8.6)
   */
  const VALID_LEAD_STAGES = ['New', 'Contacted', 'Qualified', 'Proposal Draft', 'Proposal Sent', 'Won', 'Lost'];
  const PROPOSAL_TRANSITIONS = {
    'Draft': ['In Review', 'Sent'],
    'In Review': ['Draft', 'Sent'],
    'Sent': ['Accepted', 'Declined', 'Expired', 'Draft'],
    'Accepted': [],
    'Declined': ['Draft'],
    'Expired': ['Draft']
  };

  function canTransitionProposal(fromStatus, toStatus) {
    if (fromStatus === toStatus) return true;
    const allowed = PROPOSAL_TRANSITIONS[fromStatus] || [];
    return allowed.includes(toStatus);
  }

  return {
    DEFAULT_ASSUMPTIONS,
    VALID_LEAD_STAGES,
    PROPOSAL_TRANSITIONS,
    toMinorUnits,
    fromMinorUnits,
    clampNumber,
    formatMoney,
    calculateEnergyAndTargetKw,
    calculatePanelAndInverterSizing,
    calculateBatteryEstimate,
    calculateFinancialTotals,
    calculateIllustrativePayback,
    validateQuoteRequest,
    canTransitionProposal
  };

      if (updates.owner !== undefined) lead.owner = String(updates.owner).trim();
      if (updates.notes !== undefined) lead.notes = String(updates.notes).trim();
      if (updates.nextAction !== undefined) lead.nextAction = String(updates.nextAction).trim();
      lead.updatedAt = new Date().toISOString();

      if (updates.stage && updates.stage !== prevStage) {
        logActivity(
          'lead',
          lead.id,
          'Lead Stage Updated',
          `${lead.reference} (${lead.contactName}) moved from ${prevStage} to ${lead.stage}${lead.stage === 'Lost' ? ' (Reason: ' + lead.lossReason + ')' : ''}.`
        );
      } else {
        logActivity('lead', lead.id, 'Lead Updated', `Updated details/notes on ${lead.reference}.`);
      }

      persistState();
      return { ok: true, lead };
    }

    /**
     * Create a Proposal Draft from a Lead or Saved Configuration (Section 8.6)
     * Uses current active catalog prices for new drafts, while preserving inactive product warning if needed.
     */
    function createProposalFromRecord({ leadId, configurationId }) {
      const perm = checkPermission('canEditProposals');
      if (!perm.ok) return perm;

      const orgId = getCurrentOrgId();
      const lead = leadId ? getLeadById(leadId) : null;
      const cfg = getConfigurationById(configurationId || (lead && lead.configurationId));

      if (!lead && !cfg) {
        return { ok: false, code: 'NOT_FOUND', error: 'A valid Lead or Saved Configuration is required to create a proposal.' };
      }

      const assumptions = getAssumptions();
      const allProducts = getProducts({ activeOnly: false });

      // Refresh line item prices from current active catalog for a new draft (Section 7.6 & 9.4 rule)
      let baseLines = [];
      if (cfg && cfg.computed && Array.isArray(cfg.computed.financials.lineItems)) {
        baseLines = cfg.computed.financials.lineItems.map(item => {
          const catalogProd = allProducts.find(p => p.id === item.productId);
          // If product is still active in catalog, use current catalog price for the new draft
          const unitPrice = (catalogProd && catalogProd.active) ? catalogProd.customerPrice : item.unitPrice;
          const unitCost = (catalogProd && catalogProd.active) ? catalogProd.internalUnitCost : item.unitCost;
          return Object.assign({}, item, {
            unitPrice,
            unitCost,
            lineTotal: item.quantity * unitPrice
          });
        });
      }

      const financials = Estimator.calculateFinancialTotals({
        assumptions,
        lineItems: baseLines,
        discountPercent: assumptions.defaultDiscountPercent,
        taxRatePercent: assumptions.defaultTaxRatePercent,
        discountTiming: assumptions.discountTiming
      });

      const propSeq = 200 + state.proposals.length + 1;
      const nowIso = new Date().toISOString();
      const expiryDate = new Date(Date.now() + 14 * 24 * 3600 * 1000).toISOString().slice(0, 10);
      const sysSizeKw = cfg ? cfg.computed.sizing.actualDcCapacityKw : 8.19;

      const newProposal = {
        id: 'prop_' + Date.now() + '_' + Math.floor(Math.random() * 100),
        organizationId: orgId,
        leadId: lead ? lead.id : (cfg ? cfg.leadId : null),
        configurationId: cfg ? cfg.id : null,
        reference: `PROP-2026-${propSeq}`,
        title: `${sysSizeKw} kW Solar & Storage Proposal — ${lead ? lead.contactName : (cfg ? cfg.reference : 'Customer')}`,
        status: 'Draft',
        customerSnapshot: {
          name: lead ? lead.contactName : 'Prospective Customer',
          email: lead ? lead.email : '',
          phone: lead ? lead.phone : '',
          city: lead ? lead.city : 'Islamabad'
        },
        systemSizeKw: sysSizeKw,
        currency: assumptions.currency,
        lineItemsSnapshot: financials.lineItems,
        equipmentSubtotal: financials.equipmentSubtotal,
        installationLabor: financials.installationLabor,
        otherCharges: financials.otherCharges,
        grossSubtotal: financials.grossSubtotal,
        discountPercent: financials.discountPercent,
        discountTiming: financials.discountTiming,
        discountAmount: financials.discountAmount,
        taxRatePercent: financials.taxRatePercent,
        taxAmount: financials.taxAmount,
        grandTotal: financials.grandTotal,
        amountPaid: 0,
        balanceDue: financials.grandTotal,
        scopeText: 'Supply, rooftop mounting structure, DC/AC cabling (up to 25m standard run), inverter commissioning, and safety earthing.',
        exclusionsText: 'Civil roof modifications, utility statutory fees, and cable runs over 25 meters.',
        paymentScheduleText: '50% mobilization advance • 40% upon equipment delivery • 10% upon commissioning.',
        indicativeTimelineText: '7–10 working days from advance payment and site readiness.',
        warrantyText: 'Manufacturer product warranties as specified per line item • 2-Year installation workmanship support.',
        expiryDate,
        sentAt: null,
        acceptedAt: null,
        notes: 'Draft generated from saved configuration snapshot.',
        createdAt: nowIso,
        updatedAt: nowIso
      };

      state.proposals.unshift(newProposal);

      if (lead && (lead.stage === 'New' || lead.stage === 'Contacted' || lead.stage === 'Qualified')) {
        lead.stage = 'Proposal Draft';
        lead.estimatedValue = newProposal.grandTotal;
        lead.updatedAt = nowIso;
      }
      if (cfg) {
        cfg.status = 'Converted to Proposal';
      }

      logActivity(
        'proposal',
        newProposal.id,
        'Proposal Draft Created',
        `Created ${newProposal.reference} (${Estimator.formatMoney(newProposal.grandTotal, newProposal.currency)}) from ${cfg ? cfg.reference : lead.reference}.`
      );

      persistState();
      return { ok: true, proposal: newProposal };
    }

    /**
     * Update Proposal Line Items, Pricing Adjustments, Scope, or Lifecycle Status (Section 8.6 & Workflow Rules 2 & 3)
     */
    function updateProposal(proposalId, updates) {
      const perm = checkPermission('canEditProposals');
      if (!perm.ok) return perm;

      const proposal = getProposalById(proposalId);
      if (!proposal) return { ok: false, code: 'NOT_FOUND', error: 'Proposal not found.' };

      const assumptions = getAssumptions();
      const nowIso = new Date().toISOString();

      // If transitioning status, validate lifecycle
      if (updates.status && updates.status !== proposal.status) {
        if (!Estimator.canTransitionProposal(proposal.status, updates.status)) {
          return {
            ok: false,
            code: 'INVALID_TRANSITION',
            error: `Cannot transition proposal directly from "${proposal.status}" to "${updates.status}".`
          };
        }
      }

      // Only recalculate line items if proposal is in Draft or In Review (or being reopened to Draft)
      const isEditableFinancials = proposal.status === 'Draft' || proposal.status === 'In Review' || updates.status === 'Draft';
      if (isEditableFinancials && (updates.lineItems || updates.otherCharges !== undefined || updates.discountPercent !== undefined || updates.taxRatePercent !== undefined || updates.amountPaid !== undefined || updates.discountTiming !== undefined)) {
        const linesToUse = Array.isArray(updates.lineItems) ? updates.lineItems : proposal.lineItemsSnapshot;

        // Workflow Rule 5: Check that no newly added product is inactive
        if (Array.isArray(updates.lineItems)) {
          const existingIds = new Set(proposal.lineItemsSnapshot.map(l => l.productId).filter(Boolean));
          for (const li of updates.lineItems) {
            if (li.productId && !existingIds.has(li.productId)) {
              const prod = state.products.find(p => p.id === li.productId);
              if (prod && !prod.active) {
                return {
                  ok: false,
                  code: 'INACTIVE_PRODUCT',
                  error: `Cannot add archived product "${prod.name}" to a proposal.`
                };
              }
            }
          }
        }

        const fin = Estimator.calculateFinancialTotals({
          assumptions,
          lineItems: linesToUse,
          otherCharges: updates.otherCharges !== undefined ? updates.otherCharges : proposal.otherCharges,
          discountPercent: updates.discountPercent !== undefined ? updates.discountPercent : proposal.discountPercent,
          discountTiming: updates.discountTiming !== undefined ? updates.discountTiming : proposal.discountTiming,
          taxRatePercent: updates.taxRatePercent !== undefined ? updates.taxRatePercent : proposal.taxRatePercent,
          amountPaid: updates.amountPaid !== undefined ? updates.amountPaid : proposal.amountPaid
        });

        proposal.lineItemsSnapshot = fin.lineItems;
        proposal.equipmentSubtotal = fin.equipmentSubtotal;
        proposal.installationLabor = fin.installationLabor;
        proposal.otherCharges = fin.otherCharges;
        proposal.grossSubtotal = fin.grossSubtotal;
        proposal.discountPercent = fin.discountPercent;
        proposal.discountTiming = fin.discountTiming;
        proposal.discountAmount = fin.discountAmount;
        proposal.taxRatePercent = fin.taxRatePercent;
        proposal.taxAmount = fin.taxAmount;
        proposal.grandTotal = fin.grandTotal;
        proposal.amountPaid = fin.amountPaid;
        proposal.balanceDue = fin.balanceDue;
      } else if (updates.amountPaid !== undefined) {
        // Allow updating amountPaid on Sent/Accepted proposals
        const fin = Estimator.calculateFinancialTotals({
          assumptions,
          lineItems: proposal.lineItemsSnapshot,
          otherCharges: proposal.otherCharges,
          discountPercent: proposal.discountPercent,
          discountTiming: proposal.discountTiming,
          taxRatePercent: proposal.taxRatePercent,
          amountPaid: updates.amountPaid
        });
        proposal.amountPaid = fin.amountPaid;
        proposal.balanceDue = fin.balanceDue;
      }

      if (updates.title !== undefined) proposal.title = String(updates.title).trim();
      if (updates.scopeText !== undefined) proposal.scopeText = String(updates.scopeText).trim();
      if (updates.exclusionsText !== undefined) proposal.exclusionsText = String(updates.exclusionsText).trim();
      if (updates.paymentScheduleText !== undefined) proposal.paymentScheduleText = String(updates.paymentScheduleText).trim();
      if (updates.indicativeTimelineText !== undefined) proposal.indicativeTimelineText = String(updates.indicativeTimelineText).trim();
      if (updates.warrantyText !== undefined) proposal.warrantyText = String(updates.warrantyText).trim();
      if (updates.expiryDate !== undefined) proposal.expiryDate = String(updates.expiryDate).trim();
      if (updates.notes !== undefined) proposal.notes = String(updates.notes).trim();

      const prevStatus = proposal.status;
      if (updates.status && updates.status !== prevStatus) {
        proposal.status = updates.status;
        const linkedLead = proposal.leadId ? getLeadById(proposal.leadId) : null;

        // Workflow Rule 2: When a proposal is marked Sent, lock snapshot & create follow-up due after configurable days
        if (updates.status === 'Sent') {
          proposal.sentAt = nowIso;
          if (linkedLead && linkedLead.stage !== 'Won') {
            linkedLead.stage = 'Proposal Sent';
            linkedLead.estimatedValue = proposal.grandTotal;
            linkedLead.updatedAt = nowIso;
          }
          const followUpDays = Estimator.clampNumber(assumptions.proposalFollowUpDays, 1, 30, 3);
          const dueDate = new Date(Date.now() + followUpDays * 24 * 3600 * 1000).toISOString();
          state.followUps.unshift({
            id: 'fup_' + Date.now() + '_' + Math.floor(Math.random() * 100),
            organizationId: getCurrentOrgId(),
            leadId: proposal.leadId,
            proposalId: proposal.id,
            title: `Follow up on sent proposal ${proposal.reference} (${proposal.customerSnapshot.name})`,
            type: 'Proposal Review Call',
            dueAt: dueDate,
            status: 'Upcoming',
            assignedTo: linkedLead ? linkedLead.owner : getCurrentUser().name,
            completedAt: null,
            createdAt: nowIso
          });
          logActivity(
            'proposal',
            proposal.id,
            'Proposal Marked Sent (Demo Mode)',
            `${proposal.reference} marked Sent (${Estimator.formatMoney(proposal.grandTotal, proposal.currency)}). Snapshot locked; follow-up scheduled in ${followUpDays} days. (No real email/WhatsApp dispatched in Demo Mode).`
          );
        } else if (updates.status === 'Accepted') {
          // Workflow Rule 3: When a proposal is Accepted, update linked lead stage to Won and log event
          proposal.acceptedAt = nowIso;
          if (linkedLead) {
            linkedLead.stage = 'Won';
            linkedLead.estimatedValue = proposal.grandTotal;
            linkedLead.nextAction = 'Schedule site installation & net-metering documentation';
            linkedLead.updatedAt = nowIso;
          }
          logActivity(
            'proposal',
            proposal.id,
            'Proposal Accepted & Lead Won',
            `${proposal.reference} accepted by ${proposal.customerSnapshot.name}. Linked lead moved to Won.`
          );
        } else {
          logActivity(
            'proposal',
            proposal.id,
            `Proposal Status -> ${updates.status}`,
            `${proposal.reference} transitioned from ${prevStatus} to ${updates.status}.`
          );
        }
      } else {
        logActivity('proposal', proposal.id, 'Proposal Edited', `Saved changes to ${proposal.reference}.`);
      }

      proposal.updatedAt = nowIso;
      persistState();
      return { ok: true, proposal };
    }

    /**
     * Create or Update Catalog Product (Section 8.4)
     */
    function saveProduct(productData) {
      const perm = checkPermission('canEditCatalog');
      if (!perm.ok) return perm;

      const name = String(productData.name || '').trim();
      const sku = String(productData.sku || '').trim();
      const category = String(productData.category || 'panel').trim();
      const customerPrice = Number(productData.customerPrice);
      const internalUnitCost = Number(productData.internalUnitCost !== undefined ? productData.internalUnitCost : customerPrice * 0.8);

      if (!name || !sku) {
        return { ok: false, code: 'VALIDATION_ERROR', error: 'Product SKU and display name are required.' };
      }
      if (!Number.isFinite(customerPrice) || customerPrice < 0) {
        return { ok: false, code: 'VALIDATION_ERROR', error: 'Customer unit price must be a non-negative number.' };
      }

      const orgId = getCurrentOrgId();
      const nowIso = new Date().toISOString();

      if (productData.id) {
        const existing = state.products.find(p => p.id === productData.id && p.organizationId === orgId);
        if (!existing) return { ok: false, code: 'NOT_FOUND', error: 'Product not found.' };

        existing.sku = sku;
        existing.name = name;
        existing.category = category;
        existing.description = String(productData.description || existing.description || '').trim();
        existing.manufacturer = String(productData.manufacturer || existing.manufacturer || '').trim();
        existing.customerPrice = customerPrice;
        existing.internalUnitCost = Number.isFinite(internalUnitCost) && internalUnitCost >= 0 ? internalUnitCost : existing.internalUnitCost;
        existing.warrantyText = String(productData.warrantyText || existing.warrantyText || '').trim();
        if (productData.wattage !== undefined) existing.wattage = Number(productData.wattage) || existing.wattage;
        if (productData.acCapacityKw !== undefined) existing.acCapacityKw = Number(productData.acCapacityKw) || existing.acCapacityKw;
        if (productData.inverterType !== undefined) existing.inverterType = productData.inverterType;
        if (productData.capacityKwh !== undefined) existing.capacityKwh = Number(productData.capacityKwh) || existing.capacityKwh;
        if (productData.active !== undefined) existing.active = Boolean(productData.active);
        existing.updatedAt = nowIso;

        logActivity(
          'product',
          existing.id,
          existing.active ? 'Catalog Product Updated' : 'Catalog Product Archived',
          `Updated ${existing.sku} (${existing.name}) — Price: ${Estimator.formatMoney(existing.customerPrice, getAssumptions().currency)}. Historical sent proposals remain unchanged.`
        );
        persistState();
        return { ok: true, product: existing };
      } else {
        const newProd = {
          id: 'prod_' + Date.now() + '_' + Math.floor(Math.random() * 100),
          organizationId: orgId,
          sku,
          name,
          category,
          description: String(productData.description || 'Sample demonstration product.').trim(),
          manufacturer: String(productData.manufacturer || 'SunGrid Demo Catalog').trim(),
          wattage: category === 'panel' ? (Number(productData.wattage) || 580) : undefined,
          acCapacityKw: category === 'inverter' ? (Number(productData.acCapacityKw) || 8) : undefined,
          inverterType: category === 'inverter' ? (productData.inverterType || 'hybrid') : undefined,
          capacityKwh: category === 'battery' ? (Number(productData.capacityKwh) || 5.12) : undefined,
          unit: productData.unit || 'unit',
          customerPrice,
          internalUnitCost: Number.isFinite(internalUnitCost) && internalUnitCost >= 0 ? internalUnitCost : Math.round(customerPrice * 0.8),
          warrantyText: String(productData.warrantyText || 'Standard Demo Warranty').trim(),
          active: productData.active !== false,
          createdAt: nowIso,
          updatedAt: nowIso
        };
        state.products.unshift(newProd);
        logActivity('product', newProd.id, 'Catalog Product Created', `Added ${newProd.sku} (${newProd.name}) to catalog.`);
        persistState();
        return { ok: true, product: newProd };
      }
    }

    /**
     * Update Pricing & Estimator Assumptions (Section 8.5)
     */
    function updateAssumptions(updates) {
      const perm = checkPermission('canEditAssumptions');
      if (!perm.ok) return perm;

      const a = getAssumptions();
      if (updates.currency) a.currency = String(updates.currency).trim();
      if (updates.locale) a.locale = String(updates.locale).trim();
      if (updates.regionLabel) a.regionLabel = String(updates.regionLabel).trim();
      if (updates.peakSunHoursPerDay !== undefined) {
        a.peakSunHoursPerDay = Estimator.clampNumber(updates.peakSunHoursPerDay, 1.5, 9.0, a.peakSunHoursPerDay);
      }
      if (updates.performanceFactor !== undefined) {
        a.performanceFactor = Estimator.clampNumber(updates.performanceFactor, 0.50, 0.95, a.performanceFactor);
      }
      if (updates.assumedTariffPerKwh !== undefined) {
        a.assumedTariffPerKwh = Estimator.clampNumber(updates.assumedTariffPerKwh, 1, 5000, a.assumedTariffPerKwh);
      }
      if (updates.exportCreditPerKwh !== undefined) {
        a.exportCreditPerKwh = Estimator.clampNumber(updates.exportCreditPerKwh, 0, 5000, a.exportCreditPerKwh);
      }
      if (updates.usableDodFraction !== undefined) {
        a.usableDodFraction = Estimator.clampNumber(updates.usableDodFraction, 0.50, 1.0, a.usableDodFraction);
      }
      if (updates.defaultDiscountPercent !== undefined) {
        a.defaultDiscountPercent = Estimator.clampNumber(updates.defaultDiscountPercent, 0, 50, a.defaultDiscountPercent);
      }
      if (updates.defaultTaxRatePercent !== undefined) {
        a.defaultTaxRatePercent = Estimator.clampNumber(updates.defaultTaxRatePercent, 0, 50, a.defaultTaxRatePercent);
      }
      if (updates.discountTiming === 'before_tax' || updates.discountTiming === 'after_tax') {
        a.discountTiming = updates.discountTiming;
      }
      if (updates.maxVisiblePanels !== undefined) {
        a.maxVisiblePanels = Estimator.clampNumber(updates.maxVisiblePanels, 8, 60, a.maxVisiblePanels);
      }
      if (updates.disclaimerText !== undefined) {
        a.disclaimerText = String(updates.disclaimerText).trim();
      }
      a.updatedAt = new Date().toISOString();

      const org = getOrganization();
      if (org && updates.currency) org.defaultCurrency = a.currency;
      if (org && updates.locale) org.locale = a.locale;

      logActivity('assumptions', a.id, 'Pricing & Estimator Assumptions Updated', `Updated estimator parameters (PSH: ${a.peakSunHoursPerDay}h, Perf: ${a.performanceFactor}, Currency: ${a.currency}).`);
      persistState();
      return { ok: true, assumptions: a };
    }

    /**
     * Update White-Label Organization Brand Settings (Section 8.9)
     */
    function updateOrganizationSettings(updates) {
      const perm = checkPermission('canEditSettings');
      if (!perm.ok) return perm;

      const org = getOrganization();
      if (!org) return { ok: false, error: 'Organization not found.' };

      if (updates.name && String(updates.name).trim().length >= 2) org.name = String(updates.name).trim();
      if (updates.tagline !== undefined) org.tagline = String(updates.tagline).trim();
      if (updates.primaryColor) org.primaryColor = String(updates.primaryColor).trim();
      if (updates.secondaryColor) org.secondaryColor = String(updates.secondaryColor).trim();
      if (updates.logoType) org.logoType = String(updates.logoType).trim();
      if (updates.logoUrl !== undefined) org.logoUrl = String(updates.logoUrl).trim();
      if (updates.contactEmail !== undefined) org.contactEmail = String(updates.contactEmail).trim();
      if (updates.contactPhone !== undefined) org.contactPhone = String(updates.contactPhone).trim();
      if (updates.city !== undefined) org.city = String(updates.city).trim();
      if (updates.publicCtaText !== undefined) org.publicCtaText = String(updates.publicCtaText).trim();
      if (updates.consentCopy !== undefined) org.consentCopy = String(updates.consentCopy).trim();
      if (updates.defaultCurrency) {
        org.defaultCurrency = String(updates.defaultCurrency).trim();
        state.assumptions.currency = org.defaultCurrency;
      }
      if (updates.locale) {
        org.locale = String(updates.locale).trim();
        state.assumptions.locale = org.locale;
      }
      org.updatedAt = new Date().toISOString();

      logActivity('organization', org.id, 'White-Label Brand Settings Updated', `Updated brand identity for ${org.name}.`);
      persistState();
      return { ok: true, organization: org };
    }

    /**
     * Create or Complete Follow-up Reminder (Section 8.7)
     */
    function createFollowUp(data) {
      const perm = checkPermission('canEditFollowUps');
      if (!perm.ok) return perm;

      const title = String(data.title || '').trim();
      if (!title) return { ok: false, error: 'Follow-up title is required.' };

      const fup = {
        id: 'fup_' + Date.now() + '_' + Math.floor(Math.random() * 100),
        organizationId: getCurrentOrgId(),
        leadId: data.leadId || null,
        proposalId: data.proposalId || null,
        title,
        type: data.type || 'Follow-Up Call',
        dueAt: data.dueAt || new Date(Date.now() + 24 * 3600 * 1000).toISOString(),
        status: 'Upcoming',
        assignedTo: data.assignedTo || getCurrentUser().name,
        completedAt: null,
        createdAt: new Date().toISOString()
      };
      state.followUps.unshift(fup);
      refreshFollowUpUrgency();
      logActivity('followup', fup.id, 'Follow-Up Scheduled', `Scheduled "${fup.title}" due ${fup.dueAt.slice(0, 10)}.`);
      persistState();
      return { ok: true, followUp: fup };
    }

    function toggleFollowUpComplete(followUpId) {
      const perm = checkPermission('canEditFollowUps');
      if (!perm.ok) return perm;

      const fup = state.followUps.find(f => f.id === followUpId && f.organizationId === getCurrentOrgId());
      if (!fup) return { ok: false, error: 'Follow-up not found.' };

      if (fup.status === 'Completed') {
        fup.completedAt = null;
        fup.status = 'Upcoming';
        refreshFollowUpUrgency();
        logActivity('followup', fup.id, 'Follow-Up Reopened', `Reopened follow-up "${fup.title}".`);
      } else {
        fup.completedAt = new Date().toISOString();
        fup.status = 'Completed';
        logActivity('followup', fup.id, 'Follow-Up Completed', `Completed follow-up "${fup.title}".`);
      }
      persistState();
      return { ok: true, followUp: fup };
    }

    /**
     * Section 10: Deterministic Sales Copilot (Template-Based Assistant)
     * Honest, grounded in saved records, no fake remote LLM streaming.
     */
    const copilot = {
      summarizeLead(leadId) {
        const lead = getLeadById(leadId) || getLeads()[0];
        if (!lead) return { title: 'No Lead Selected', body: 'Select a lead to generate a grounded summary.', sources: [] };
        const cfg = lead.configurationId ? getConfigurationById(lead.configurationId) : null;
        const props = getProposals().filter(p => p.leadId === lead.id);
        const fups = getFollowUps().filter(f => f.leadId === lead.id && f.status !== 'Completed');
        const currency = getAssumptions().currency;

        const lines = [
          `Lead Summary: ${lead.contactName} (${lead.reference})`,
          `• Current Stage: ${lead.stage} | Assigned Owner: ${lead.owner}`,
          `• Location & Source: ${lead.city} via ${lead.source} (Preferred contact: ${lead.preferredContactMethod.toUpperCase()})`,
          cfg
            ? `• Attached Configuration (${cfg.reference}): ${cfg.computed.sizing.actualDcCapacityKw} kW DC (${cfg.computed.sizing.selectedPanelCount} panels), ${cfg.includeBattery ? cfg.computed.battery.totalNominalCapacityKwh + ' kWh LFP backup' : 'Grid-tied (no battery)'} — Preliminary total ${Estimator.formatMoney(cfg.computed.financials.grandTotal, currency)}.`
            : `• Estimated Pipeline Value: ${Estimator.formatMoney(lead.estimatedValue, currency)}.`,
          props.length > 0
            ? `• Linked Proposals: ${props.map(p => `${p.reference} (${p.status} — ${Estimator.formatMoney(p.grandTotal, p.currency)})`).join(', ')}.`
            : `• Linked Proposals: None created yet.`,
          `• Recorded Notes: "${lead.notes || 'No notes entered.'}"`,
          `• Recommended Next Action: ${fups.length > 0 ? fups[0].title + ' (' + fups[0].status + ')' : lead.nextAction}`
        ];

        return {
          modeLabel: 'Template-Based Demo Assistant (Deterministic)',
          title: `Lead Brief — ${lead.reference}`,
          body: lines.join('\n'),
          sources: [lead.reference, cfg ? cfg.reference : null, ...props.map(p => p.reference)].filter(Boolean)
        };
      },

      draftFollowUpMessage(leadId) {
        const lead = getLeadById(leadId) || getLeads()[0];
        if (!lead) return { title: 'No Lead Selected', body: '', sources: [] };
        const org = getOrganization();

  /**
   * Generate a procedural solar cell texture using an offscreen HTML5 canvas
   */
  function createSolarPanelTexture() {
    if (typeof document === 'undefined') return null;
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    if (!ctx) return null;

    // Deep monocrystalline silicon base gradient
    const grad = ctx.createLinearGradient(0, 0, 256, 512);
    grad.addColorStop(0, '#0a192f');
    grad.addColorStop(0.5, '#0f294a');
    grad.addColorStop(1, '#081426');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 256, 512);

    // Outer aluminum frame border
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 10;
    ctx.strokeRect(5, 5, 246, 502);

    // Cell grid (6 columns x 12 half-cut rows)
    const cols = 6;
    const rows = 12;
    const pad = 12;
    const cellW = (256 - pad * 2) / cols;
    const cellH = (512 - pad * 2) / rows;

    ctx.strokeStyle = 'rgba(148, 163, 184, 0.38)';
    ctx.lineWidth = 1.5;

    for (let c = 1; c < cols; c++) {
      const x = pad + c * cellW;
      ctx.beginPath();
      ctx.moveTo(x, pad);
      ctx.lineTo(x, 512 - pad);
      ctx.stroke();
    }
    for (let r = 1; r < rows; r++) {
      const y = pad + r * cellH;
      ctx.beginPath();
      ctx.moveTo(pad, y);
      ctx.lineTo(256 - pad, y);
      ctx.stroke();
    }

    // Center half-cut busbar line
    ctx.strokeStyle = 'rgba(226, 232, 240, 0.55)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(pad, 256);
    ctx.lineTo(256 - pad, 256);
    ctx.stroke();

    // Subtle cell diamond intersections
    ctx.fillStyle = 'rgba(203, 213, 225, 0.45)';
    for (let c = 1; c < cols; c++) {
      for (let r = 1; r < rows; r++) {
        const cx = pad + c * cellW;
        const cy = pad + r * cellH;
        ctx.beginPath();
        ctx.arc(cx, cy, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (typeof THREE !== 'undefined') {
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }
    return null;
  }

      southSlope.userData = { componentKey: 'roof_structure' };
      roofStructureGroup.add(southSlope);

      // North-facing pitched roof slope (tilted -22 degrees toward -Z)
      const northSlope = new THREE.Mesh(southSlopeGeo, roofMat);
      northSlope.position.set(-0.6, 4.48, -1.82);
      northSlope.rotation.x = -pitchRad;
      northSlope.castShadow = true;
      northSlope.receiveShadow = true;
      northSlope.userData = { componentKey: 'roof_structure' };
      roofStructureGroup.add(northSlope);

      // Gable triangles under the pitched roof
      const gableShape = new THREE.Shape();
      gableShape.moveTo(-3.5, 0);
      gableShape.lineTo(3.5, 0);
      gableShape.lineTo(0, 1.48);
      gableShape.closePath();
      const gableExtrude = new THREE.ExtrudeGeometry(gableShape, { depth: 9.55, bevelEnabled: false });
      const gableMesh = new THREE.Mesh(gableExtrude, mainWallsMat);
      gableMesh.rotation.y = Math.PI / 2;
      gableMesh.position.set(-5.38, 3.8, 0);
      roofStructureGroup.add(gableMesh);

      // Side Wing Flat Parapet Roof
      const wingRoofGeo = new THREE.BoxGeometry(4.1, 0.2, 6.1);
      const wingRoof = new THREE.Mesh(wingRoofGeo, roofMat);
      wingRoof.position.set(4.5, 3.15, 0.3);
      wingRoof.receiveShadow = true;
      wingRoof.userData = { componentKey: 'roof_structure' };
      roofStructureGroup.add(wingRoof);

      propertyGroup.add(roofStructureGroup);
    }

    /**
     * Rebuild solar panel modules, inverter, and LFP battery storage bank based on config
     */
    function rebuildSolarAndEquipment() {
      if (!scene) return;
      disposeHierarchy(panelsGroup);
      disposeHierarchy(inverterGroup);
      disposeHierarchy(batteryGroup);

      if (!panelTexture) {
        panelTexture = createSolarPanelTexture();
      }

      const pitchRad = (22 * Math.PI) / 180;
      const visibleCount = Math.max(0, Math.min(36, Number(currentConfig.visiblePanelCount) || 14));

      // Materials for solar modules
      const frameMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.7, roughness: 0.3 });
      const cellMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: panelTexture || null,
        metalness: 0.45,
        roughness: 0.18
      });
      const railMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8, roughness: 0.3 });

      const modW = 1.02;
      const modH = 0.05;
      const modD = 1.62;
      const gapX = 0.10;
      const gapZ = 0.14;

      // Place up to 18 panels on the primary South slope (2 rows of 9)
      // Place panels 19..30 on the North/Secondary slope, and 31..36 on the side wing roof
      let placed = 0;

      // Helper to place a sloped array
      function placeSlopeArray(maxModules, cols, rowCount, baseCenter, slopeSign) {
        const slopeModules = Math.min(maxModules, visibleCount - placed);
        if (slopeModules <= 0) return;

        // Add mounting rails
        const activeRows = Math.ceil(slopeModules / cols);
        for (let r = 0; r < activeRows; r++) {
          const colsInThisRow = Math.min(cols, slopeModules - r * cols);
          const railWidth = colsInThisRow * (modW + gapX) - gapX + 0.2;
          const localZ = (r - (rowCount - 1) / 2) * (modD + gapZ);
          const worldZ = baseCenter.z + localZ * Math.cos(pitchRad);
          const worldY = baseCenter.y - slopeSign * localZ * Math.sin(pitchRad);

          const railGeo = new THREE.BoxGeometry(railWidth, 0.04, 0.06);
          const railMesh = new THREE.Mesh(railGeo, railMat);
          const xOffset = -((cols - colsInThisRow) * (modW + gapX)) / 2;
          railMesh.position.set(baseCenter.x + xOffset, worldY - 0.03, worldZ);
          railMesh.rotation.x = slopeSign * pitchRad;
          panelsGroup.add(railMesh);
        }

        for (let i = 0; i < slopeModules; i++) {
          const r = Math.floor(i / cols);
          const c = i % cols;
          const localX = (c - (cols - 1) / 2) * (modW + gapX);
          const localZ = (r - (rowCount - 1) / 2) * (modD + gapZ);

          const worldX = baseCenter.x + localX;
          const worldZ = baseCenter.z + localZ * Math.cos(pitchRad);
          const worldY = baseCenter.y - slopeSign * localZ * Math.sin(pitchRad);

          const modGroup = new THREE.Group();
          modGroup.position.set(worldX, worldY, worldZ);
          modGroup.rotation.x = slopeSign * pitchRad;

          const frameMesh = new THREE.Mesh(new THREE.BoxGeometry(modW, modH, modD), frameMat);
          frameMesh.castShadow = true;
          frameMesh.receiveShadow = true;
          frameMesh.userData = { componentKey: 'solar_array' };
          modGroup.add(frameMesh);

          const glassMesh = new THREE.Mesh(new THREE.BoxGeometry(modW - 0.05, 0.015, modD - 0.05), cellMat);
          glassMesh.position.y = modH / 2 + 0.005;
          glassMesh.userData = { componentKey: 'solar_array' };
          modGroup.add(glassMesh);

          panelsGroup.add(modGroup);
          placed++;
        }
      }

      // 1. Primary South Slope (up to 16 modules: 2 rows x 8 cols)
      placeSlopeArray(16, 8, 2, { x: -0.6, y: 4.66, z: 1.82 }, +1);

      // 2. Secondary Slope (up to 16 modules: 2 rows x 8 cols)
      if (placed < visibleCount) {
        placeSlopeArray(16, 8, 2, { x: -0.6, y: 4.66, z: -1.82 }, -1);
      }

      // 3. Side Wing Roof Tilt Frames (remaining up to 4 modules)
      if (placed < visibleCount) {
        const extra = visibleCount - placed;
        for (let k = 0; k < Math.min(extra, 4); k++) {
          const r = Math.floor(k / 2);
          const c = k % 2;
          const wx = 3.85 + c * 1.3;
          const wz = -0.8 + r * 1.9;
          const wy = 3.38;

          const modGroup = new THREE.Group();
          modGroup.position.set(wx, wy, wz);
          modGroup.rotation.x = (15 * Math.PI) / 180;

          const frameMesh = new THREE.Mesh(new THREE.BoxGeometry(modW, modH, modD), frameMat);
          frameMesh.castShadow = true;
          frameMesh.userData = { componentKey: 'solar_array' };
          modGroup.add(frameMesh);

          const glassMesh = new THREE.Mesh(new THREE.BoxGeometry(modW - 0.05, 0.015, modD - 0.05), cellMat);
          glassMesh.position.y = modH / 2 + 0.005;
          glassMesh.userData = { componentKey: 'solar_array' };
          modGroup.add(glassMesh);

          panelsGroup.add(modGroup);
          placed++;
        }
      }

      // 4. Exterior Wall Inverter + BOS Protection Box (Mounted on Right Side Wall x = 6.45)
      const invWallX = 6.42;
      const isHybrid = currentConfig.includeBattery || String(currentConfig.inverterName).toLowerCase().includes('hybrid');

      // Inverter Chassis
      const invChassisGeo = new THREE.BoxGeometry(0.28, 0.85, 0.62);
      const invChassisMat = new THREE.MeshStandardMaterial({
        color: isHybrid ? 0xf8fafc : 0xe2e8f0,
        metalness: 0.35,
        roughness: 0.3
      });
      const invChassis = new THREE.Mesh(invChassisGeo, invChassisMat);
      invChassis.position.set(invWallX, 1.85, 1.35);
      invChassis.castShadow = true;
      invChassis.userData = { componentKey: 'inverter_unit' };
      inverterGroup.add(invChassis);

      // Inverter Top Accent / Display Bar
      const invAccentGeo = new THREE.BoxGeometry(0.30, 0.16, 0.56);
      const invAccentMat = new THREE.MeshStandardMaterial({
        color: 0x0f172a,
        emissive: isHybrid ? 0xf59e0b : 0x38bdf8,
        emissiveIntensity: 0.45
      });
      const invAccent = new THREE.Mesh(invAccentGeo, invAccentMat);
      invAccent.position.set(invWallX + 0.01, 2.02, 1.35);
      invAccent.userData = { componentKey: 'inverter_unit' };
      inverterGroup.add(invAccent);

      // DC/AC BOS Protection Box next to inverter
      const bosGeo = new THREE.BoxGeometry(0.20, 0.48, 0.38);
      const bosMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.4, roughness: 0.5 });
      const bosBox = new THREE.Mesh(bosGeo, bosMat);
      bosBox.position.set(invWallX, 1.82, 2.02);
      bosBox.userData = { componentKey: 'inverter_unit' };
      inverterGroup.add(bosBox);

      // Vertical conduit pipe from roof to inverter
      const conduitGeo = new THREE.CylinderGeometry(0.03, 0.03, 1.35, 8);
      const conduitMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.6 });
      const conduit = new THREE.Mesh(conduitGeo, conduitMat);
      conduit.position.set(invWallX - 0.02, 2.65, 1.35);
      inverterGroup.add(conduit);

      // 5. Optional LiFePO4 Battery Storage Units (Positioned on utility wall pad next to inverter)
      if (currentConfig.includeBattery && currentConfig.selectedBatteryQuantity > 0) {
        const displayPacks = Math.min(4, Math.max(1, Number(currentConfig.selectedBatteryQuantity) || 1));

        // Concrete Equipment Pad
        const padGeo = new THREE.BoxGeometry(0.9, 0.12, 3.2);
        const padMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.85 });
        const pad = new THREE.Mesh(padGeo, padMat);
        pad.position.set(invWallX + 0.25, 0.08, -0.55);
        batteryGroup.add(pad);

        for (let b = 0; b < displayPacks; b++) {
          const bz = 0.45 - b * 0.72;
          const packGroup = new THREE.Group();
          packGroup.position.set(invWallX + 0.18, 0.78, bz);

          const bodyGeo = new THREE.BoxGeometry(0.34, 1.25, 0.58);
          const bodyMat = new THREE.MeshStandardMaterial({
            color: 0xf1f5f9,
            metalness: 0.25,
            roughness: 0.35
          });
          const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
          bodyMesh.castShadow = true;
          bodyMesh.userData = { componentKey: 'battery_bank' };
          packGroup.add(bodyMesh);

          // Emerald State-of-Charge LED Strip
          const ledGeo = new THREE.BoxGeometry(0.36, 0.08, 0.42);
          const ledMat = new THREE.MeshStandardMaterial({
            color: 0x10b981,
            emissive: 0x10b981,
            emissiveIntensity: currentConfig.lightingMode === 'evening' ? 0.95 : 0.55
          });
          const ledMesh = new THREE.Mesh(ledGeo, ledMat);
          ledMesh.position.set(0.01, 0.42, 0);
          ledMesh.userData = { componentKey: 'battery_bank' };
          packGroup.add(ledMesh);

          // Dark front faceplate trim
          const trimGeo = new THREE.BoxGeometry(0.35, 0.75, 0.46);
          const trimMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4 });
          const trimMesh = new THREE.Mesh(trimGeo, trimMat);
          trimMesh.position.set(0.005, -0.08, 0);
          trimMesh.userData = { componentKey: 'battery_bank' };
          packGroup.add(trimMesh);

          batteryGroup.add(packGroup);
        }
      }
    }

    function applyLightingAndOrientation() {
      if (!scene) return;
      const isNight = currentConfig.lightingMode === 'evening';
      scene.background = new THREE.Color(isNight ? 0x070d19 : 0x0f172a);
      scene.fog = new THREE.FogExp2(isNight ? 0x070d19 : 0x0f172a, 0.015);

      if (ambientLight) {
        ambientLight.intensity = isNight ? 0.35 : 0.65;
        ambientLight.color.setHex(isNight ? 0x93c5fd : 0xffffff);
      }
      if (hemiLight) {
        hemiLight.intensity = isNight ? 0.28 : 0.55;
      }
      if (sunLight) {
        sunLight.intensity = isNight ? 0.35 : 1.15;
        sunLight.color.setHex(isNight ? 0x60a5fa : 0xfffbeb);
        sunLight.position.set(isNight ? -10 : 12, isNight ? 11 : 16, isNight ? -8 : 11);
      }
      if (sunOrb) {
        sunOrb.position.set(isNight ? -13 : 14, isNight ? 11 : 14, isNight ? -10 : 10);
        sunOrb.material.color.setHex(isNight ? 0xe0f2fe : 0xfbbf24);
      }

      // Rotate property slightly based on roof orientation preset
      const orientationAngles = {
        'South': 0,
        'South-West': 0.38,
        'South-East': -0.38,
        'West': 0.78
      };
      const rotY = orientationAngles[currentConfig.roofOrientation] || 0;
      if (propertyGroup) propertyGroup.rotation.y = rotY;
      if (panelsGroup) panelsGroup.rotation.y = rotY;
      if (inverterGroup) inverterGroup.rotation.y = rotY;
      if (batteryGroup) batteryGroup.rotation.y = rotY;

      windowMeshes.forEach(mat => {
        mat.color.setHex(isNight ? 0xfde68a : 0x38bdf8);
        mat.emissive.setHex(isNight ? 0xf59e0b : 0x0284c7);
        mat.emissiveIntensity = isNight ? 0.9 : 0.15;
      });
    }

    function updateCameraPositionFromSpherical() {
      if (!camera) return;
      // Smooth damping toward goal
      camState.theta += (camState.goalTheta - camState.theta) * 0.16;
      camState.phi += (camState.goalPhi - camState.phi) * 0.16;
      camState.radius += (camState.goalRadius - camState.radius) * 0.16;
      camState.target.x += (camState.goalTarget.x - camState.target.x) * 0.16;
      camState.target.y += (camState.goalTarget.y - camState.target.y) * 0.16;
      camState.target.z += (camState.goalTarget.z - camState.target.z) * 0.16;

      const sinPhi = Math.sin(camState.phi);
      const x = camState.target.x + camState.radius * sinPhi * Math.sin(camState.theta);
      const y = camState.target.y + camState.radius * Math.cos(camState.phi);
      const z = camState.target.z + camState.radius * sinPhi * Math.cos(camState.theta);

      camera.position.set(x, Math.max(1.2, y), z);
      camera.lookAt(camState.target.x, camState.target.y, camState.target.z);
    }

    function initWebGLScene() {
      if (!containerEl) return false;
      webglSupported = checkWebGLAvailable();
      if (!webglSupported || force2DMode) {
        render2DSchematicSVG(containerEl, currentConfig, onSelectComponent);
        return false;
      }

      try {
        containerEl.innerHTML = '';
        const width = Math.max(300, containerEl.clientWidth || 640);
        const height = Math.max(260, containerEl.clientHeight || 400);

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(42, width / height, 0.5, 120);

        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.domElement.style.display = 'block';
        renderer.domElement.style.width = '100%';
        renderer.domElement.style.height = '100%';
        renderer.domElement.style.touchAction = 'pan-y';
        containerEl.appendChild(renderer.domElement);

        // Lighting
        ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);

        hemiLight = new THREE.HemisphereLight(0xe0f2fe, 0x1e293b, 0.55);
        scene.add(hemiLight);

        sunLight = new THREE.DirectionalLight(0xfffbeb, 1.15);
        sunLight.position.set(12, 16, 11);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 2;
        sunLight.shadow.camera.far = 45;
        const d = 12;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.bias = -0.0008;
        scene.add(sunLight);

        // Visual Sun/Moon Orb
        sunOrb = new THREE.Mesh(
          new THREE.SphereGeometry(0.85, 16, 16),
          new THREE.MeshBasicMaterial({ color: 0xfbbf24 })
        );
        sunOrb.position.set(14, 14, 10);
        scene.add(sunOrb);

        propertyGroup = new THREE.Group();
        panelsGroup = new THREE.Group();
        inverterGroup = new THREE.Group();
        batteryGroup = new THREE.Group();

        scene.add(propertyGroup);
        scene.add(panelsGroup);
        scene.add(inverterGroup);
        scene.add(batteryGroup);

        buildBaseArchitecture();
        rebuildSolarAndEquipment();
        applyLightingAndOrientation();
        updateCameraPositionFromSpherical();

        // Pointer / Touch / Wheel Interaction + Raycast Selection
        let isDragging = false;
        let pointerDownPos = { x: 0, y: 0 };
        let lastPos = { x: 0, y: 0 };
        let pinchStartDist = 0;

        const dom = renderer.domElement;

        dom.addEventListener('mousedown', (e) => {
          isDragging = true;
          pointerDownPos = { x: e.clientX, y: e.clientY };
          lastPos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
          if (!isDragging) return;
          const dx = e.clientX - lastPos.x;
          const dy = e.clientY - lastPos.y;
          lastPos = { x: e.clientX, y: e.clientY };
          camState.goalTheta -= dx * 0.0075;
          camState.goalPhi = Math.max(0.28, Math.min(1.42, camState.goalPhi - dy * 0.0065));
        });

        window.addEventListener('mouseup', (e) => {
          if (!isDragging) return;
          isDragging = false;
          const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
          if (dist < 6) {
            handleRaycastClick(e.clientX, e.clientY);
          }
        });

        dom.addEventListener('wheel', (e) => {
          e.preventDefault();
          camState.goalRadius = Math.max(9.5, Math.min(34, camState.goalRadius + e.deltaY * 0.012));
        }, { passive: false });

        dom.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            isDragging = true;
            pointerDownPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            lastPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          } else if (e.touches.length === 2) {
            isDragging = false;
            pinchStartDist = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
          }
        }, { passive: true });

        dom.addEventListener('touchmove', (e) => {
          if (e.touches.length === 1 && isDragging) {
            const dx = e.touches[0].clientX - lastPos.x;
            const dy = e.touches[0].clientY - lastPos.y;
            if (Math.abs(dx) > Math.abs(dy)) {
              e.preventDefault();
            }
            lastPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            camState.goalTheta -= dx * 0.008;
            camState.goalPhi = Math.max(0.28, Math.min(1.42, camState.goalPhi - dy * 0.006));
          } else if (e.touches.length === 2 && pinchStartDist > 0) {
            e.preventDefault();
            const dist = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
            const delta = pinchStartDist - dist;
            camState.goalRadius = Math.max(9.5, Math.min(34, camState.goalRadius + delta * 0.04));
            pinchStartDist = dist;
          }
        }, { passive: false });

        dom.addEventListener('touchend', () => {
          isDragging = false;
          pinchStartDist = 0;
        }, { passive: true });

        function handleRaycastClick(clientX, clientY) {
          if (!renderer || !camera || !scene) return;
          const rect = renderer.domElement.getBoundingClientRect();
          const mouse = new THREE.Vector2(
            ((clientX - rect.left) / rect.width) * 2 - 1,
            -((clientY - rect.top) / rect.height) * 2 + 1
          );
          const raycaster = new THREE.Raycaster();
          raycaster.setFromCamera(mouse, camera);
          const targets = [
            ...panelsGroup.children,
            ...inverterGroup.children,
            ...batteryGroup.children,
            ...roofStructureGroup.children
          ];
          const intersects = raycaster.intersectObjects(targets, true);
          if (intersects.length > 0) {
            let obj = intersects[0].object;
            while (obj && (!obj.userData || !obj.userData.componentKey) && obj.parent) {
              obj = obj.parent;
            }
            if (obj && obj.userData && obj.userData.componentKey) {
              onSelectComponent(obj.userData.componentKey);
            }
          }
        }

        function animate() {
          if (isDisposed) return;
          animFrameId = requestAnimationFrame(animate);
          if (!force2DMode && renderer && scene && camera) {
            updateCameraPositionFromSpherical();
            renderer.render(scene, camera);
          }
        }
        if (animFrameId) cancelAnimationFrame(animFrameId);
        animate();
        return true;
      } catch (err) {
        webglSupported = false;
        render2DSchematicSVG(containerEl, currentConfig, onSelectComponent);
        return false;
      }
    }

    function setCameraPreset(presetName) {
      if (presetName === 'roof') {
        camState.goalTheta = 0.05;
        camState.goalPhi = 0.42;
        camState.goalRadius = 15.5;
        camState.goalTarget = { x: -0.5, y: 3.8, z: 0.4 };
      } else if (presetName === 'equipment') {
        camState.goalTheta = 1.32;
        camState.goalPhi = 1.18;
        camState.goalRadius = 11.2;
        camState.goalTarget = { x: 5.5, y: 1.5, z: 0.4 };
      } else {
        // 'overview' or 'reset'
        camState.goalTheta = 0.62;
        camState.goalPhi = 1.02;
        camState.goalRadius = 21.5;
        camState.goalTarget = { x: 0, y: 2.3, z: 0 };
      }
    }

    function updateConfiguration(newCfg) {
      const prevCutaway = currentConfig.cutawayMode;
      const prevProjectType = currentConfig.projectType;
      Object.assign(currentConfig, newCfg || {});

      if (!webglSupported || force2DMode || !renderer) {
        render2DSchematicSVG(containerEl, currentConfig, onSelectComponent);
        return;
      }

      if (prevCutaway !== currentConfig.cutawayMode || prevProjectType !== currentConfig.projectType) {
        buildBaseArchitecture();
      }
      rebuildSolarAndEquipment();
      applyLightingAndOrientation();
    }

    function toggleRenderMode(use2D) {
      force2DMode = Boolean(use2D);
      if (force2DMode) {
        if (animFrameId) cancelAnimationFrame(animFrameId);
        render2DSchematicSVG(containerEl, currentConfig, onSelectComponent);
      } else {
        initWebGLScene();
      }
      return force2DMode ? '2d' : (webglSupported ? '3d' : '2d');
    }

    function handleResize() {
      if (!containerEl || !renderer || !camera || force2DMode || !webglSupported) return;
      const w = Math.max(280, containerEl.clientWidth || 600);
      const h = Math.max(240, containerEl.clientHeight || 380);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    function dispose() {
      isDisposed = true;
      if (animFrameId) cancelAnimationFrame(animFrameId);
      disposeHierarchy(propertyGroup);
      disposeHierarchy(panelsGroup);
      disposeHierarchy(inverterGroup);
      disposeHierarchy(batteryGroup);
      if (panelTexture && panelTexture.dispose) panelTexture.dispose();
      if (renderer && renderer.dispose) renderer.dispose();
    }

    // Initialize on creation
    initWebGLScene();
    if (typeof window !== 'undefined') {
      window.addEventListener('resize', handleResize);
    }

    return {
      updateConfiguration,
      setCameraPreset,
      toggleRenderMode,
      handleResize,
      dispose,
      isWebGLActive: () => webglSupported && !force2DMode
    };
  }

  return {
    createSolarSceneController,
    render2DSchematicSVG
  };
});
