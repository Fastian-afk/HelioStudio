  /**
   * 8.1 Overview Dashboard
   */
  function renderOverviewDashboard(app) {
    const assumptions = app.store.getAssumptions();
    const fmt = (v) => window.HelioEstimator.formatMoney(v, assumptions.currency, assumptions.locale);
    const leads = app.store.getLeads();
    const proposals = app.store.getProposals();
    const configs = app.store.getConfigurations();
    const followUps = app.store.getFollowUps();
    const activities = app.store.getActivities().slice(0, 7);

    // Date range filter (All Demo Days vs Last 5 Days)
    const rangeFilter = app.workspaceState.dashboardRange || 'all';
    const cutoffIso = rangeFilter === '5d' ? '2026-10-12' : '2026-01-01';
    const filteredLeads = leads.filter(l => String(l.createdAt).slice(0, 10) >= cutoffIso);

    const qualifiedLeads = filteredLeads.filter(l => ['Qualified', 'Proposal Draft', 'Proposal Sent', 'Won'].includes(l.stage));
    const pipelineValue = qualifiedLeads.reduce((s, l) => s + (Number(l.estimatedValue) || 0), 0);
    const awaitingProposals = proposals.filter(p => p.status === 'Sent' || p.status === 'In Review');
    const openProposals = proposals.filter(p => ['Draft', 'In Review', 'Sent'].includes(p.status));
    const openProposalValue = openProposals.reduce((s, p) => s + (Number(p.grandTotal) || 0), 0);

    const conversionRate = filteredLeads.length > 0
      ? Math.round((proposals.length / Math.max(1, leads.length)) * 100)
      : 0;

    return `
      <div class="space-y-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold text-slate-900">Company Workspace Overview</h1>
            <p class="text-xs text-slate-500">Derived directly from persisted leads, 3D configurations, proposals, and follow-up schedules.</p>
          </div>
          <div class="flex items-center gap-2">
            <label for="dash-range-select" class="text-xs text-slate-600 font-medium">Period Filter:</label>
            <select id="dash-range-select" data-action="change-dash-range" class="px-3 py-1.5 text-xs bg-white border border-slate-300 rounded-lg font-semibold">

              <option value="5d" ${rangeFilter === '5d' ? 'selected' : ''}>Recent 5 Days ( since Oct 12 )</option>
            </select>
            <button type="button" data-action="copilot-action" data-copilot-fn="daily_brief" class="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-amber-400 text-xs font-semibold">
              Generate Owner's Daily Brief

        <!-- Derived KPI Cards (Clickable to navigate) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <div data-action="nav" data-route="/app/leads" class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm cursor-pointer hover:border-amber-400 transition">
            <div class="text-xs font-semibold text-slate-500">Enquiries in Period</div>
            <div class="text-2xl font-extrabold text-slate-900 mt-1">${filteredLeads.length}</div>
            <div class="text-[11px] text-emerald-700 font-medium mt-1">${filteredLeads.filter(l => l.stage === 'New').length} New awaiting contact →</div>
          </div>

          <div data-action="nav" data-route="/app/leads" class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm cursor-pointer hover:border-amber-400 transition">
            <div class="text-xs font-semibold text-slate-500">Qualified Pipeline Value</div>
            <div class="text-2xl font-extrabold text-slate-900 mt-1">${fmt(pipelineValue)}</div>
            <div class="text-[11px] text-slate-500 mt-1">${qualifiedLeads.length} qualified / active leads →</div>
          </div>

          <div data-action="nav" data-route="/app/proposals" class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm cursor-pointer hover:border-amber-400 transition">
            <div class="text-xs font-semibold text-slate-500">Open Proposals (${openProposals.length})</div>
            <div class="text-2xl font-extrabold text-amber-600 mt-1">${fmt(openProposalValue)}</div>
            <div class="text-[11px] text-sky-700 font-medium mt-1">${awaitingProposals.length} awaiting customer response →</div>

          <div data-action="nav" data-route="/app/analytics" class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm cursor-pointer hover:border-amber-400 transition">
            <div class="text-xs font-semibold text-slate-500">Enquiry → Proposal Rate</div>
            <div class="text-2xl font-extrabold text-emerald-700 mt-1">${conversionRate}%</div>

        <!-- Charts Row (Chart.js inside fixed-height containers) -->

              <div>
                <h2 class="text-sm font-bold text-slate-900">Follow-Up Reminders &amp; Tasks</h2>

              </div>
              <button type="button" data-action="open-new-followup-modal" class="px-2.5 py-1 rounded-lg bg-slate-900 text-white text-xs font-semibold hover:bg-slate-800">
                + Add Follow-Up
              </button>
            </div>

            <div class="space-y-2.5">
              ${followUps.map(f => {
                const badgeCls = f.status === 'Overdue'
                  ? 'bg-rose-100 text-rose-800 border-rose-200'
                  : (f.status === 'Due Today' ? 'bg-amber-100 text-amber-800 border-amber-200' : (f.status === 'Completed' ? 'bg-emerald-100 text-emerald-800 border-emerald-200' : 'bg-slate-100 text-slate-700 border-slate-200'));
                return `

                      <div>

              <p class="text-[11px] text-slate-500">Every configurator quote, status transition, and rule action is logged</p>
            </div>
            <div class="space-y-3">
              ${activities.map(a => `
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-200/80 text-xs">
                  <div class="flex items-center justify-between text-[11px] text-slate-500">
                    <span class="font-bold text-slate-800">${esc(a.action)}</span>

  /**
   * 8.2 Leads and Enquiry Pipeline (List & Kanban Views)
   */
  function renderLeadsListAndPipeline(app) {
    const assumptions = app.store.getAssumptions();
    const fmt = (v) => window.HelioEstimator.formatMoney(v, assumptions.currency, assumptions.locale);
    const allLeads = app.store.getLeads();
    const ws = app.workspaceState;

    const q = (ws.leadSearch || '').toLowerCase().trim();
    const stageFilter = ws.leadStageFilter || 'ALL';
    const sourceFilter = ws.leadSourceFilter || 'ALL';
    const viewMode = ws.leadViewMode || 'table'; // 'table' | 'kanban'

    const filtered = allLeads.filter(l => {
      if (stageFilter !== 'ALL' && l.stage !== stageFilter) return false;
      if (sourceFilter !== 'ALL' && l.source !== sourceFilter) return false;
      if (q) {
        const hay = `${l.reference} ${l.contactName} ${l.email} ${l.phone} ${l.city} ${l.owner}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    const stages = window.HelioEstimator.VALID_LEAD_STAGES;

    return `
      <div class="space-y-5">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold text-slate-900">Leads &amp; Enquiry Pipeline</h1>
            <p class="text-xs text-slate-500">Quote requests from the 3D configurator land here automatically with their configuration snapshot attached.</p>
          </div>
          <div class="flex items-center gap-2">
            <div class="inline-flex rounded-xl bg-slate-200 p-1 text-xs font-semibold">
              <button type="button" data-action="lead-view-mode" data-mode="table" class="px-3 py-1.5 rounded-lg ${viewMode === 'table' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">Table View</button>
              <button type="button" data-action="lead-view-mode" data-mode="kanban" class="px-3 py-1.5 rounded-lg ${viewMode === 'kanban' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">Kanban Board</button>
            </div>
            <button type="button" data-action="nav" data-route="/configure" class="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs">
              + New via 3D Configurator
            </button>
          </div>
        </div>

        <!-- Search & Filter Bar -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm grid grid-cols-1 sm:grid-cols-4 gap-3 text-xs">
          <div class="sm:col-span-2">
            <label for="lead-search-input" class="block text-[11px] font-semibold text-slate-500 mb-1">Search Name, Reference, City, Phone</label>
            <input id="lead-search-input" type="search" placeholder="Search e.g. Kamran, ENQ-2026-101, Islamabad..." value="${esc(ws.leadSearch || '')}"
              data-action="lead-search" class="w-full px-3 py-2 border border-slate-300 rounded-lg"/>

          <div>

            <select id="lead-stage-filter" data-action="lead-stage-filter" class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white">
              <option value="ALL">All Stages (${allLeads.length})</option>
              ${stages.map(s => `<option value="${esc(s)}" ${stageFilter === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label for="lead-source-filter" class="block text-[11px] font-semibold text-slate-500 mb-1">Filter by Source</label>
            <select id="lead-source-filter" data-action="lead-source-filter" class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white">
              <option value="ALL">All Sources</option>
              ${['3D Configurator', 'Consultation Tablet', 'Website Direct', 'Referral', 'Partner Agency'].map(src => `<option value="${esc(src)}" ${sourceFilter === src ? 'selected' : ''}>${esc(src)}</option>`).join('')}
            </select>

        ${filtered.length === 0 ? `

            <p class="text-xs text-slate-500">Clear filters or create a new customer enquiry from the 3D configurator.</p>
            <button type="button" data-action="clear-lead-filters" class="px-4 py-2 rounded-lg bg-slate-900 text-white text-xs font-semibold">Reset Filters</button>
          </div>
        ` : (viewMode === 'kanban' ? `
          <!-- Kanban Pipeline Board -->
          <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
            ${['New', 'Contacted', 'Qualified', 'Proposal Draft', 'Proposal Sent', 'Won', 'Lost'].map(stg => {
              const stageLeads = filtered.filter(l => l.stage === stg);
              return `
                <div class="bg-slate-200/70 p-3 rounded-2xl border border-slate-300/80 space-y-2.5">
                  <div class="flex items-center justify-between px-1">
                    ${stageBadge(stg)}

                        <div class="text-[11px] text-slate-500">${esc(l.city)}</div>
                        <div class="pt-1 border-t border-slate-100 flex items-center justify-between text-xs">
                          <span class="font-mono font-bold text-amber-700">${fmt(l.estimatedValue)}</span>
                          <span class="text-[10px] text-sky-600 font-semibold">Inspect →</span>
                        </div>
                      </div>
                    `).join('') || `<div class="text-[11px] text-slate-400 text-center py-4">No leads in ${esc(stg)}</div>`}
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-x-auto">
            <table class="w-full text-xs text-left border-collapse">
              <thead>
                <tr class="border-b border-slate-200 bg-slate-50 text-slate-500">
                  <th class="py-3 px-4 font-semibold">Ref / Created</th>
                  <th class="py-3 px-4 font-semibold">Customer &amp; City</th>
                  <th class="py-3 px-4 font-semibold">Source &amp; Config</th>
                  <th class="py-3 px-4 font-semibold">Stage</th>
                  <th class="py-3 px-4 font-semibold text-right">Est. Value</th>
                  <th class="py-3 px-4 font-semibold">Owner</th>
                  <th class="py-3 px-4 font-semibold text-right">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${filtered.map(l => {
                  const cfg = l.configurationId ? app.store.getConfigurationById(l.configurationId) : null;
                  return `
                    <tr class="hover:bg-slate-50/80">
                      <td class="py-3 px-4 font-mono">
                        <div class="font-bold text-slate-900">${esc(l.reference)}</div>
                        <div class="text-[11px] text-slate-400">${esc(l.createdAt.slice(0, 10))}</div>
                      </td>
                      <td class="py-3 px-4">
                        <div class="font-bold text-slate-900">${esc(l.contactName)}</div>
                        <div class="text-[11px] text-slate-500">${esc(l.city)} • ${esc(l.phone || l.email)}</div>
                      </td>
                      <td class="py-3 px-4">
                        <div class="font-medium text-slate-800">${esc(l.source)}</div>
                        <div class="text-[11px] text-slate-500">${cfg ? `${esc(cfg.reference)} (${cfg.computed.sizing.actualDcCapacityKw} kW)` : 'Direct inquiry'}</div>

                      <td class="py-3 px-4">${stageBadge(l.stage)}</td>
                      <td class="py-3 px-4 text-right font-mono font-bold text-slate-900">${fmt(l.estimatedValue)}</td>

                        <button type="button" data-action="nav" data-route="/app/leads/${esc(l.id)}" class="px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 text-white font-semibold">
                          Open Detail
                        </button>
                      </td>
                    </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        `)}
      </div>
    `;
  }

  /**
   * 8.2 Lead Detail View with Attached Configuration Snapshot & 1-Click Proposal Creation
   */
  function renderLeadDetail(app, leadId) {
    const lead = app.store.getLeadById(leadId);
    if (!lead) {
      return `
        <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center space-y-3">
          <h2 class="text-lg font-bold text-slate-900">Lead Record Not Found</h2>
          <button type="button" data-action="nav" data-route="/app/leads" class="px-4 py-2 rounded-lg bg-slate-900 text-white text-xs font-semibold">← Back to Leads</button>
        </div>`;
    }

    const assumptions = app.store.getAssumptions();
    const fmt = (v) => window.HelioEstimator.formatMoney(v, assumptions.currency, assumptions.locale);
    const cfg = lead.configurationId ? app.store.getConfigurationById(lead.configurationId) : null;
    const linkedProposals = app.store.getProposals().filter(p => p.leadId === lead.id);
    const stages = window.HelioEstimator.VALID_LEAD_STAGES;
    const users = app.store.getUsers();

    return `

  /**

        <div class="flex flex-wrap gap-1.5">

              class="px-3 py-1.5 rounded-xl text-xs font-semibold ${catFilter === c.k ? 'bg-slate-900 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">

            <div class="flex items-center justify-between">

              <div class="sm:col-span-2">
                <label class="block font-semibold text-slate-700 mb-1">Display Name *</label>
                <input name="name" type="text" required value="${esc(editingProd.name || '')}" class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white"/>
              </div>
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Category</label>
                <select name="category" class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white">
                  ${['panel', 'inverter', 'battery', 'mounting', 'bos', 'labor'].map(cat => `<option value="${cat}" ${editingProd.category === cat ? 'selected' : ''}>${cat.toUpperCase()}</option>`).join('')}
                </select>
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
              <div>
                <label class="block font-semibold text-slate-700 mb-1">Customer Unit Price (${esc(assumptions.currency)}) *</label>

                    <td class="py-3 px-4 text-right font-mono text-slate-600">

                    </td>
                  </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>

              <label for="assump-discount" class="block font-semibold text-slate-700 mb-1">Default Discount (%)</label>
              <input id="assump-discount" name="defaultDiscountPercent" type="number" step="0.5" min="0" max="40" value="${a.defaultDiscountPercent}" class="w-full px-3 py-2 border border-slate-300 rounded-lg font-mono"/>

            <div>
              <label for="assump-tax" class="block font-semibold text-slate-700 mb-1">Default Tax Rate (%)</label>

                <option value="before_tax" ${a.discountTiming === 'before_tax' ? 'selected' : ''}>Apply Discount Before Tax</option>

            <div>
              <label for="assump-cap" class="block font-semibold text-slate-700 mb-1">3D Max Visible Panels Cap</label>
              <input id="assump-cap" name="maxVisiblePanels" type="number" min="12" max="60" value="${a.maxVisiblePanels}" class="w-full px-3 py-2 border border-slate-300 rounded-lg font-mono"/>

  /**

  function renderProposalsList(app) {

                <th class="py-3 px-4 font-semibold">System Size</th>
                <th class="py-3 px-4 font-semibold">Status</th>

                <tr class="hover:bg-slate-50">
                  <td class="py-3 px-4 font-mono">
                    <div class="font-bold text-slate-900">${esc(p.reference)}</div>
                    <div class="text-[11px] text-slate-400">Exp: ${esc(p.expiryDate)}</div>

                  <td class="py-3 px-4">

  /**
   * 8.6 Proposal Editor & Customer-Ready Printable Document View
   */
  function renderProposalEditor(app, proposalId) {
    const p = app.store.getProposalById(proposalId);
    if (!p) {
      return `<div class="p-8 bg-white rounded-2xl border text-center"><button type="button" data-action="nav" data-route="/app/proposals" class="px-4 py-2 bg-slate-900 text-white rounded-lg text-xs">← Back to Proposals</button></div>`;
    }

    const org = app.store.getOrganization();
    const assumptions = app.store.getAssumptions();
    const fmt = (v) => window.HelioEstimator.formatMoney(v, p.currency || assumptions.currency, assumptions.locale);
    const activeCatalog = app.store.getProducts({ activeOnly: true });
    const isLocked = p.status !== 'Draft' && p.status !== 'In Review';
    const allowedNext = window.HelioEstimator.PROPOSAL_TRANSITIONS[p.status] || [];

    return `
      <div class="space-y-6">
        <!-- Non-Print Builder Toolbar -->

            <button type="button" data-action="nav" data-route="/app/proposals" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold">
              ← Proposals

            <div>
              <div class="flex items-center gap-2">
                <span class="font-mono font-bold text-sm text-amber-400">${esc(p.reference)}</span>

                ${isLocked ? '<span class="text-[11px] px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">Snapshot Locked</span>' : '<span class="text-[11px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300">Editable Draft</span>'}

              <p class="text-[11px] text-slate-400 mt-0.5">Lifecycle transitions update linked lead &amp; follow-up tasks automatically. (No external email/WhatsApp is dispatched in Demo Mode).</p>

          <div class="flex flex-wrap items-center gap-2">
            ${allowedNext.map(nextStatus => `
              <button type="button" data-action="transition-proposal-status" data-proposal-id="${esc(p.id)}" data-status="${esc(nextStatus)}"
                class="px-3 py-1.5 rounded-lg text-xs font-bold ${
                  nextStatus === 'Sent' ? 'bg-amber-500 text-slate-950 hover:bg-amber-400' :
                  (nextStatus === 'Accepted' ? 'bg-emerald-500 text-slate-950 hover:bg-emerald-400' : 'bg-slate-800 text-slate-200 hover:bg-slate-700')

                Mark as ${esc(nextStatus)}
              </button>
            `).join('')}
            <button type="button" data-action="copilot-explain-proposal" data-proposal-id="${esc(p.id)}" class="px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold">

        <!-- Editable Line Items & Pricing Controls (Hidden when printing) -->
        ${!isLocked ? `
          <div class="no-print bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4 text-xs">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
              <h2 class="text-sm font-bold text-slate-900">Draft Proposal Line-Item &amp; Pricing Editor</h2>
              <div class="flex items-center gap-2">
                <select id="prop-add-product-select" aria-label="Select catalog product to add" class="px-2.5 py-1.5 border border-slate-300 rounded-lg bg-white">
                  ${activeCatalog.map(prod => `<option value="${esc(prod.id)}">${esc(prod.name)} (${fmt(prod.customerPrice)})</option>`).join('')}
                </select>
                <button type="button" data-action="proposal-add-line" data-proposal-id="${esc(p.id)}" class="px-3 py-1.5 rounded-lg bg-slate-900 text-amber-400 font-semibold">
                  + Add Line Item
                </button>
              </div>
            </div>

            <div class="space-y-2">
              ${p.lineItemsSnapshot.map((li, idx) => `
                <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 items-center p-2.5 rounded-xl bg-slate-50 border border-slate-200">
                  <div class="sm:col-span-5">
                    <div class="font-bold text-slate-900">${esc(li.name)}</div>
                    <div class="text-[11px] text-slate-500 font-mono">${esc(li.sku)}</div>
                  </div>
                  <div class="sm:col-span-2">
                    <label class="text-[10px] text-slate-500 block">Qty</label>
                    <input type="number" min="1" max="500" value="${li.quantity}"

                  <div class="sm:col-span-2">
                    <label class="text-[10px] text-slate-500 block">Unit Price</label>
                    <input type="number" min="0" step="500" value="${li.unitPrice}"

                  <div class="sm:col-span-2 text-right font-mono font-bold text-slate-900">
                    ${fmt(li.lineTotal)}

                  <div class="sm:col-span-1 text-right">
                    <button type="button" data-action="proposal-remove-line" data-proposal-id="${esc(p.id)}" data-line-idx="${idx}" class="text-rose-600 hover:text-rose-800 font-bold px-2 py-1">✕</button>
                  </div>
                </div>
              `).join('')}

            <!-- Adjustments & Scope Form -->
            <form id="proposal-details-form" data-proposal-id="${esc(p.id)}" class="space-y-4 pt-3 border-t border-slate-200">

                <div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Scope of Work</label>
                  <textarea name="scopeText" rows="2" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg">${esc(p.scopeText)}</textarea>

                <div>
                  <label class="block font-semibold text-slate-700 mb-1">Exclusions</label>
                  <textarea name="exclusionsText" rows="2" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg">${esc(p.exclusionsText)}</textarea>

              </div>

              <div class="flex justify-end">
                <button type="submit" class="px-5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold">
                  Save Proposal Draft &amp; Recalculate Totals
                </button>
              </div>
            </form>
          </div>
        ` : ''}

        <!-- Customer-Ready Printable Proposal Document -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-10 space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b-2 border-slate-900 pb-5">
            <div class="flex items-center gap-3">
              ${window.HelioUIPublic.renderBrandMark(org)}
              <div>
                <h1 class="text-xl font-extrabold text-slate-900">${esc(org.name)}</h1>

              <div class="text-xs font-bold uppercase tracking-wider text-amber-600">Commercial Solar &amp; Storage Proposal</div>

                <span class="font-mono text-amber-600">${fmt(p.grandTotal)}</span>

  /**
   * 8.8 Honest Analytics Derived from Persisted Records
   */
  function renderAnalyticsView(app) {
    const assumptions = app.store.getAssumptions();
    const fmt = (v) => window.HelioEstimator.formatMoney(v, assumptions.currency, assumptions.locale);
    const leads = app.store.getLeads();
    const proposals = app.store.getProposals();
    const configs = app.store.getConfigurations();

    // Calculate estimated gross margin across proposals using Estimator
    let totalProposalRev = 0;
    let totalProposalMargin = 0;
    proposals.forEach(p => {
      const fin = window.HelioEstimator.calculateFinancialTotals({
        assumptions,
        lineItems: p.lineItemsSnapshot,
        otherCharges: p.otherCharges,
        discountPercent: p.discountPercent,
        taxRatePercent: p.taxRatePercent
      });
      totalProposalRev += fin.grandTotal;
      totalProposalMargin += fin.estimatedGrossMargin;
    });
    const avgMarginPct = totalProposalRev > 0 ? Math.round((totalProposalMargin / totalProposalRev) * 1000) / 10 : 0;

    return `

    function showToast(message, type = 'success') {
      const container = document.getElementById('helio-toast-container');
      if (!container) return;
      const el = document.createElement('div');
      const colorCls = type === 'error'
        ? 'bg-rose-900 text-white border-rose-700'
        : (type === 'warning' ? 'bg-amber-900 text-amber-100 border-amber-700' : 'bg-slate-900 text-white border-slate-700');
      el.className = `px-4 py-3 rounded-xl shadow-xl border text-xs font-semibold flex items-center justify-between gap-3 transition-all duration-200 ${colorCls}`;
      el.innerHTML = `
        <span>${window.HelioUIPublic.escapeHtml(message)}</span>
        <button type="button" class="text-slate-400 hover:text-white font-bold">✕</button>
      `;
      el.querySelector('button').addEventListener('click', () => el.remove());
      container.appendChild(el);
      setTimeout(() => {
        if (el.parentNode) el.remove();
      }, 4500);
    }

    function destroyActiveCharts() {
      app.activeCharts.forEach(c => {
        try { c.destroy(); } catch (e) {}
      });
      app.activeCharts = [];
    }

    function disposeActive3DScene() {
      if (app.activeSceneController) {
        try { app.activeSceneController.dispose(); } catch (e) {}
        app.activeSceneController = null;
      }
    }

    function sync3DSceneWithConfigurator() {
      if (!app.activeSceneController) return;
      const computed = app.store.buildConfigurationComputation(app.configuratorState);
      app.activeSceneController.updateConfiguration({
        visiblePanelCount: computed.sizing.visiblePanelCount,
        selectedPanelCount: computed.sizing.selectedPanelCount,
        actualDcCapacityKw: computed.sizing.actualDcCapacityKw,
        panelName: computed.panelProduct ? computed.panelProduct.name : 'Solar Module',
        inverterName: computed.inverterProduct ? computed.inverterProduct.name : 'Inverter',
        batteryName: computed.batteryProduct ? computed.batteryProduct.name : 'LFP Battery',
        includeBattery: computed.includeBattery,
        selectedBatteryQuantity: computed.battery.selectedBatteryQuantity,
        totalNominalCapacityKwh: computed.battery.totalNominalCapacityKwh,
        dcAcRatio: computed.sizing.dcAcRatio,
        projectType: app.configuratorState.projectType,
        roofOrientation: app.configuratorState.roofOrientation,
        lightingMode: app.configuratorState.lightingMode,
        cutawayMode: app.configuratorState.cutawayMode
      });
    }

    function mountChartsIfPresent() {
      destroyActiveCharts();
      if (typeof Chart === 'undefined') return;

      const leads = app.store.getLeads();
      const configs = app.store.getConfigurations();
      const proposals = app.store.getProposals();

      // 1. Dashboard Stages Chart
      const ctxStages = document.getElementById('chart-dashboard-stages');
      if (ctxStages) {
        const stageLabels = ['New', 'Contacted', 'Qualified', 'Proposal Draft', 'Proposal Sent', 'Won', 'Lost'];
        const counts = stageLabels.map(s => leads.filter(l => l.stage === s).length);
        const c1 = new Chart(ctxStages, {
          type: 'bar',
          data: {
            labels: stageLabels,
            datasets: [{
              label: 'Leads Count',
              data: counts,
              backgroundColor: ['#0284c7', '#6366f1', '#d97706', '#9333ea', '#2563eb', '#10b981', '#64748b'],
              borderRadius: 6
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
          }
        });
        app.activeCharts.push(c1);
      }

      // 2. Dashboard Packages Chart
      const ctxPkgs = document.getElementById('chart-dashboard-packages');
      if (ctxPkgs) {
        const pkgKeys = ['essential', 'balanced', 'backup_plus'];
        const pkgNames = ['Essential Grid-Tied', 'Balanced Hybrid', 'Backup Plus'];
        const pkgCounts = pkgKeys.map(k => configs.filter(c => c.selectedPackageKey === k).length);
        const c2 = new Chart(ctxPkgs, {
          type: 'doughnut',
          data: {
            labels: pkgNames,
            datasets: [{
              data: pkgCounts,
              backgroundColor: ['#0284c7', '#f59e0b', '#10b981']
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom' } }
          }
        });

    /**
     * Render the application for the current route
     */
    function renderApp(options = {}) {
      const rootEl = document.getElementById('heliostudio-app-root');
      if (!rootEl) return;

      const route = app.currentRoute || '/';

      // If only updating the right-hand controls of /configure while keeping 3D canvas alive
      if (options.preserve3D && route.startsWith('/configure') && app.activeSceneController) {
        sync3DSceneWithConfigurator();
      }

      disposeActive3DScene();
      destroyActiveCharts();

      if (route === '/' || route === '') {
        rootEl.innerHTML = window.HelioUIPublic.renderLandingPage(app);
        const heroEl = document.getElementById('hero-3d-viewport');
        if (heroEl) {
          app.activeSceneController = window.HelioScene3D.createSolarSceneController(heroEl);
          sync3DSceneWithConfigurator();
        }
      } else if (route.startsWith('/configure')) {
        const parts = route.split('/').filter(Boolean);
        if (parts[1]) {
          const saved = app.store.getConfigurationById(parts[1]);
          if (saved) {
            loadSavedConfigIntoState(saved);
          }
        }
        rootEl.innerHTML = window.HelioUIPublic.renderConfiguratorPage(app);
        const cfgViewport = document.getElementById('configurator-3d-viewport');
        if (cfgViewport) {
          app.activeSceneController = window.HelioScene3D.createSolarSceneController(cfgViewport, {
            onSelectComponent(partKey) {
              app.configuratorState.selected3DPart = partKey;
              renderApp();
            }
          });
          if (app.configuratorState.use2DMode) {
            app.activeSceneController.toggleRenderMode(true);
          }
          sync3DSceneWithConfigurator();
        }
      } else if (route.startsWith('/quote/')) {
        const token = route.replace('/quote/', '').trim();
        rootEl.innerHTML = window.HelioUIPublic.renderShareQuotePage(app, token);
      } else if (route.startsWith('/app')) {
        const parts = route.split('/').filter(Boolean); // ['app', subRoute, paramId]
        const subRoute = parts[1] || 'overview';
        const paramId = parts[2] || null;
        rootEl.innerHTML = window.HelioUIWorkspace.renderWorkspaceShell(app, subRoute, paramId);
        mountChartsIfPresent();
      } else {
        app.currentRoute = '/';
        renderApp();
        return;
      }

      renderActiveModal();
    }

    function loadSavedConfigIntoState(saved) {
      app.configuratorState.projectType = saved.projectType || 'home_backup';
      app.configuratorState.selectedPackageKey = saved.selectedPackageKey || 'balanced';
      app.configuratorState.roofOrientation = saved.roofOrientation || 'South';
      app.configuratorState.energyInput = Object.assign({}, saved.energyInput || { energyInputMode: 'kwh', monthlyKwh: 950 });
      app.configuratorState.panelProductId = saved.panelProductId;
      app.configuratorState.inverterProductId = saved.inverterProductId;
      app.configuratorState.batteryProductId = saved.batteryProductId;
      app.configuratorState.includeBattery = Boolean(saved.includeBattery);
      if (saved.computed && saved.computed.sizing) {
        app.configuratorState.manualPanelCount = saved.computed.sizing.selectedPanelCount;
      }
      if (saved.computed && saved.computed.battery) {
        app.configuratorState.manualBatteryQuantity = saved.computed.battery.selectedBatteryQuantity;
        app.configuratorState.backupLoadKw = saved.computed.battery.backupLoadKw;
      }
    }

    function navigate(route) {
      app.currentRoute = route || '/';
      app.workspaceState.mobileNavOpen = false;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Global Click Delegation
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.getAttribute('data-action');

      if (action === 'nav') {
        e.preventDefault();
        navigate(btn.getAttribute('data-route') || '/');
      } else if (action === 'start-preset-context') {
        app.configuratorState.projectType = btn.getAttribute('data-context') || 'home_backup';
        navigate('/configure');
      } else if (action === 'hero-cam' || action === 'cfg-cam') {
        if (app.activeSceneController) {
          app.activeSceneController.setCameraPreset(btn.getAttribute('data-preset') || 'overview');
        }
      } else if (action === 'hero-light-toggle' || action === 'cfg-toggle-lighting') {
        app.configuratorState.lightingMode = app.configuratorState.lightingMode === 'evening' ? 'day' : 'evening';
        if (app.currentRoute.startsWith('/configure')) {
          renderApp();
        } else {
          sync3DSceneWithConfigurator();
        }
      } else if (action === 'cfg-toggle-cutaway') {
        app.configuratorState.cutawayMode = !app.configuratorState.cutawayMode;
        renderApp();
      } else if (action === 'cfg-render-mode') {
        app.configuratorState.use2DMode = btn.getAttribute('data-mode') === '2d';
        renderApp();
      } else if (action === 'cfg-step') {
        app.configuratorState.activeStep = Number(btn.getAttribute('data-step')) || 1;
        renderApp();
      } else if (action === 'select-project-type') {
        const pt = btn.getAttribute('data-project-type') || 'home';
        app.configuratorState.projectType = pt;
        app.configuratorState.energyInput.demoProfileKey = pt;
        if (pt === 'home') {
          applyPackagePreset('essential');
        } else if (pt === 'small_business') {
          applyPackagePreset('backup_plus');
        } else {
          applyPackagePreset('balanced');
        }
        renderApp();
      } else if (action === 'set-energy-mode') {
        const mode = btn.getAttribute('data-mode') || 'kwh';
        app.configuratorState.energyInput.energyInputMode = mode;
        app.configuratorState.manualPanelCount = null; // Let sizing recalculate from energy demand
        renderApp();
      } else if (action === 'apply-demo-profile') {
        app.configuratorState.energyInput.energyInputMode = 'demo_profile';
        app.configuratorState.energyInput.demoProfileKey = app.configuratorState.projectType;
        app.configuratorState.manualPanelCount = null;
        showToast('Applied illustrative demonstration energy profile.');
        renderApp();
      } else if (action === 'select-package') {
        const pkgKey = btn.getAttribute('data-package-key');
        applyPackagePreset(pkgKey);
        showToast(`Switched to ${pkgKey.toUpperCase()} package preset.`);
        renderApp();
      } else if (action === 'save-config-only') {
        const res = app.store.saveConfigurationSnapshot(app.configuratorState, 'Saved Session');
        if (res.ok) {
          showToast(`Saved configuration ${res.configuration.reference}. Opening read-only share view.`);
          navigate(`/quote/${res.configuration.shareToken}`);
        }
      } else if (action === 'fill-sample-customer') {
        app.configuratorState.quoteForm = {
          contactName: 'Zainab & Omar Mansoor (Sample)',
          email: 'omar.mansoor.sample@example.com',
          phone: '+92 300 5550188',
          preferredContactMethod: 'whatsapp',
          city: 'F-8/3, Islamabad',
          notes: 'South-facing concrete roof, looking for hybrid backup for 3 bedrooms and home office.',
          consentAccepted: true
        };
        app.configuratorState.quoteErrors = {};
        renderApp();
        showToast('Populated sample customer details for quick testing.');
      } else if (action === 'open-lead-in-admin') {
        const lid = btn.getAttribute('data-lead-id');
        navigate(`/app/leads/${lid}`);
      } else if (action === 'open-share-view') {
        const tok = btn.getAttribute('data-token');
        navigate(`/quote/${tok}`);
      } else if (action === 'load-config-into-studio') {
        const cid = btn.getAttribute('data-config-id');
        navigate(`/configure/${cid}`);
      } else if (action === 'print-page') {
        window.print();
      } else if (action === 'toggle-mobile-nav') {
        app.workspaceState.mobileNavOpen = !app.workspaceState.mobileNavOpen;
        renderApp();
      } else if (action === 'toggle-copilot-drawer') {
        app.workspaceState.copilotOpen = !app.workspaceState.copilotOpen;
        renderApp();
      } else if (action === 'copilot-action') {
        const fn = btn.getAttribute('data-copilot-fn');
        if (fn === 'daily_brief') {
          app.workspaceState.copilotOutput = app.store.copilot.generateDailyBrief();
        } else if (fn === 'lead_summary') {
          app.workspaceState.copilotOutput = app.store.copilot.summarizeLead();
        } else if (fn === 'followup_draft') {
          app.workspaceState.copilotOutput = app.store.copilot.draftFollowUpMessage();
        } else if (fn === 'proposal_explain') {
          app.workspaceState.copilotOutput = app.store.copilot.explainProposalForCustomer();
        }
        app.workspaceState.copilotOpen = true;
        renderApp();
      } else if (action === 'copilot-lead-summary') {
        const lid = btn.getAttribute('data-lead-id');
        app.workspaceState.copilotOutput = app.store.copilot.summarizeLead(lid);
        app.workspaceState.copilotOpen = true;
        renderApp();
      } else if (action === 'copilot-explain-proposal') {
        const pid = btn.getAttribute('data-proposal-id');
        app.workspaceState.copilotOutput = app.store.copilot.explainProposalForCustomer(pid);
        app.workspaceState.copilotOpen = true;
        renderApp();
      } else if (action === 'copy-copilot-text') {
        const ta = document.getElementById('copilot-editable-text');
        if (ta) {
          ta.select();
          try {
            document.execCommand('copy');
            showToast('Copied Copilot draft to clipboard.');
          } catch (err) {
            showToast('Text selected — press Ctrl+C / Cmd+C to copy.');
          }
        }
      } else if (action === 'quick-admin-role') {
        app.store.setActiveRole('Owner/Admin');
        showToast('Switched active demo role back to Owner/Admin.');
        renderApp();
      } else if (action === 'lead-view-mode') {
        app.workspaceState.leadViewMode = btn.getAttribute('data-mode') || 'table';
        renderApp();
      } else if (action === 'clear-lead-filters') {
        app.workspaceState.leadSearch = '';
        app.workspaceState.leadStageFilter = 'ALL';
        app.workspaceState.leadSourceFilter = 'ALL';
        renderApp();
      } else if (action === 'create-proposal-from-lead') {
        const lid = btn.getAttribute('data-lead-id');
        const res = app.store.createProposalFromRecord({ leadId: lid });
        if (!res.ok) {
          showToast(res.error, 'error');
        } else {
          showToast(`Created proposal draft ${res.proposal.reference}.`);
          navigate(`/app/proposals/${res.proposal.id}`);
        }
      } else if (action === 'create-proposal-from-config') {
        const cid = btn.getAttribute('data-config-id');
        const res = app.store.createProposalFromRecord({ configurationId: cid });
        if (!res.ok) {
          showToast(res.error, 'error');
        } else {
          showToast(`Created proposal draft ${res.proposal.reference}.`);
          navigate(`/app/proposals/${res.proposal.id}`);
        }
      } else if (action === 'transition-proposal-status') {
        const pid = btn.getAttribute('data-proposal-id');
        const st = btn.getAttribute('data-status');
        const res = app.store.updateProposal(pid, { status: st });
        if (!res.ok) {
          showToast(res.error, 'error');
        } else {
          showToast(`Proposal ${res.proposal.reference} marked as ${st}.`);
          renderApp();
        }
      } else if (action === 'proposal-add-line') {
        const pid = btn.getAttribute('data-proposal-id');
        const prop = app.store.getProposalById(pid);
        const sel = document.getElementById('prop-add-product-select');
        if (prop && sel) {
          const prod = app.store.getProducts({ activeOnly: false }).find(p => p.id === sel.value);
          if (prod) {
            const updatedLines = [...prop.lineItemsSnapshot, {
              id: 'li_' + Date.now(),
              productId: prod.id,
              sku: prod.sku,
              name: prod.name,
              category: prod.category,
              description: prod.description,
              warrantyText: prod.warrantyText,
              quantity: 1,
              unitPrice: prod.customerPrice,
              unitCost: prod.internalUnitCost
            }];
            const res = app.store.updateProposal(pid, { lineItems: updatedLines });
            if (!res.ok) showToast(res.error, 'error');
            else {
              showToast(`Added ${prod.name} to proposal.`);
              renderApp();
            }
          }
        }
      } else if (action === 'proposal-remove-line') {
        const pid = btn.getAttribute('data-proposal-id');
        const idx = Number(btn.getAttribute('data-line-idx'));
        const prop = app.store.getProposalById(pid);
        if (prop && prop.lineItemsSnapshot.length > 1) {
          const updatedLines = prop.lineItemsSnapshot.filter((_, i) => i !== idx);
          const res = app.store.updateProposal(pid, { lineItems: updatedLines });
          if (!res.ok) showToast(res.error, 'error');
          else {
            showToast('Removed line item and recalculated proposal totals.');
            renderApp();
          }
        } else {
          showToast('A proposal must have at least one line item.', 'warning');
        }
      } else if (action === 'catalog-cat-filter') {
        app.workspaceState.catalogCategoryFilter = btn.getAttribute('data-cat') || 'ALL';
        renderApp();
      } else if (action === 'open-product-form') {
        const pid = btn.getAttribute('data-product-id');
        if (pid) {
          app.workspaceState.editingProduct = app.store.getProducts({ activeOnly: false }).find(p => p.id === pid) || {};
        } else {
          app.workspaceState.editingProduct = { category: 'panel', customerPrice: 32000, internalUnitCost: 25500, wattage: 600 };
        }
        renderApp();
      } else if (action === 'close-product-form') {
        app.workspaceState.editingProduct = null;
        renderApp();
      } else if (action === 'toggle-product-archive') {
        const pid = btn.getAttribute('data-product-id');
        const prod = app.store.getProducts({ activeOnly: false }).find(p => p.id === pid);
        if (prod) {
          const res = app.store.saveProduct(Object.assign({}, prod, { active: !prod.active }));
          if (!res.ok) showToast(res.error, 'error');
          else {
            showToast(`${prod.sku} ${res.product.active ? 'restored to active catalog' : 'archived (excluded from new configurations)'}.`);
            renderApp();
          }
        }
      } else if (action === 'toggle-followup') {
        const fid = btn.getAttribute('data-followup-id');
        const res = app.store.toggleFollowUpComplete(fid);
        if (!res.ok) showToast(res.error, 'error');
        else {
          showToast(`Follow-up marked ${res.followUp.status}.`);
          renderApp();
        }
      } else if (action === 'open-new-followup-modal') {
        app.workspaceState.activeModal = 'new_followup';
        renderActiveModal();
      } else if (action === 'open-reset-modal') {
        app.workspaceState.activeModal = 'reset_demo';
        renderActiveModal();
      } else if (action === 'close-modal') {
        app.workspaceState.activeModal = null;
        renderActiveModal();
      } else if (action === 'confirm-reset-demo') {
        app.store.resetToSeedData();
        app.workspaceState.activeModal = null;
        app.configuratorState.submissionResult = null;
        showToast('Restored deterministic seed data for SunGrid Energy.');
        renderApp();
      }
    });

    function applyPackagePreset(pkgKey) {
      const pkg = app.store.getPackages().find(p => p.key === pkgKey);
      if (!pkg) return;
      app.configuratorState.selectedPackageKey = pkg.key;
      app.configuratorState.panelProductId = pkg.panelProductId;
      app.configuratorState.inverterProductId = pkg.inverterProductId;
      app.configuratorState.batteryProductId = pkg.batteryProductId;
      app.configuratorState.includeBattery = Boolean(pkg.includeBattery);
      app.configuratorState.manualPanelCount = null;
      app.configuratorState.manualBatteryQuantity = pkg.defaultBatteryQty || 1;
    }

    // Global Input & Change Delegation
    document.addEventListener('change', (e) => {
      const el = e.target;
      const action = el.getAttribute('data-action');
      if (!action) return;

      if (action === 'input-monthly-kwh') {
        app.configuratorState.energyInput.monthlyKwh = Number(el.value) || 900;
        app.configuratorState.manualPanelCount = null;
        renderApp();
      } else if (action === 'input-monthly-bill') {
        app.configuratorState.energyInput.monthlyBillAmount = Number(el.value) || 42000;
        app.configuratorState.manualPanelCount = null;
        renderApp();
      } else if (action === 'input-assumed-tariff') {
        app.configuratorState.energyInput.customTariffPerKwh = Number(el.value) || 45;
        app.configuratorState.manualPanelCount = null;
        renderApp();
      } else if (action === 'change-panel-count') {
        app.configuratorState.manualPanelCount = Number(el.value) || 14;
        renderApp();
      } else if (action === 'change-panel-product') {
        app.configuratorState.panelProductId = el.value;
        renderApp();
      } else if (action === 'change-inverter-product') {
        app.configuratorState.inverterProductId = el.value;
        renderApp();
      } else if (action === 'toggle-include-battery') {
        app.configuratorState.includeBattery = Boolean(el.checked);
        if (el.checked && !app.configuratorState.batteryProductId) {
          const firstBat = app.store.getProducts({ activeOnly: true, category: 'battery' })[0];
          if (firstBat) app.configuratorState.batteryProductId = firstBat.id;
          app.configuratorState.manualBatteryQuantity = 1;
        }
        renderApp();
      } else if (action === 'change-battery-product') {
        app.configuratorState.batteryProductId = el.value;
        renderApp();
      } else if (action === 'change-battery-qty') {
        app.configuratorState.manualBatteryQuantity = Number(el.value) || 1;
        renderApp();
      } else if (action === 'change-backup-load') {
        app.configuratorState.backupLoadKw = Number(el.value) || 1.8;
        renderApp();
      } else if (action === 'change-roof-orientation') {
        app.configuratorState.roofOrientation = el.value;
        renderApp();
      } else if (action === 'switch-demo-role') {
        const res = app.store.setActiveRole(el.value);
        if (res.ok) {
          showToast(`Simulated role switched to ${res.user.role} (${res.user.name}).`);
          renderApp();
        }
      } else if (action === 'change-dash-range') {
        app.workspaceState.dashboardRange = el.value;
        renderApp();
      } else if (action === 'lead-stage-filter') {
        app.workspaceState.leadStageFilter = el.value;
        renderApp();
      } else if (action === 'lead-source-filter') {
        app.workspaceState.leadSourceFilter = el.value;
        renderApp();
      } else if (action === 'proposal-line-qty' || action === 'proposal-line-price') {
        const pid = el.getAttribute('data-proposal-id');
        const idx = Number(el.getAttribute('data-line-idx'));
        const prop = app.store.getProposalById(pid);
        if (prop && prop.lineItemsSnapshot[idx]) {
          const updatedLines = prop.lineItemsSnapshot.map((item, i) => {
            if (i !== idx) return item;
            return Object.assign({}, item, {
              quantity: action === 'proposal-line-qty' ? Math.max(1, Number(el.value) || 1) : item.quantity,
              unitPrice: action === 'proposal-line-price' ? Math.max(0, Number(el.value) || 0) : item.unitPrice
            });
          });
          const res = app.store.updateProposal(pid, { lineItems: updatedLines });
          if (!res.ok) showToast(res.error, 'error');
          else renderApp();
        }
      }
    });

    // Live search input handler for leads
    document.addEventListener('input', (e) => {
      const el = e.target;
      if (el.getAttribute('data-action') === 'lead-search') {
        app.workspaceState.leadSearch = el.value;
        renderApp();
        const inputAfter = document.getElementById('lead-search-input');
        if (inputAfter) {
          inputAfter.focus();
          inputAfter.setSelectionRange(inputAfter.value.length, inputAfter.value.length);
        }
      }
    });

    // Form Submissions Delegation
    document.addEventListener('submit', (e) => {
      const form = e.target;
      if (!form || !form.id) return;
      e.preventDefault();

      if (form.id === 'quote-request-form') {
        const fd = new FormData(form);
        const quoteData = {
          contactName: fd.get('contactName') || '',
          email: fd.get('email') || '',
          phone: fd.get('phone') || '',
          preferredContactMethod: fd.get('preferredContactMethod') || 'whatsapp',
          city: fd.get('city') || '',
          notes: fd.get('notes') || '',
          consentAccepted: form.querySelector('#q-consent') ? form.querySelector('#q-consent').checked : false
        };
        app.configuratorState.quoteForm = quoteData;
        const res = app.store.submitQuoteRequest(app.configuratorState, quoteData);
        if (!res.ok) {
          app.configuratorState.quoteErrors = res.errors || {};
          showToast('Please fix the highlighted validation fields before submitting.', 'error');
          renderApp();
        } else {
          app.configuratorState.quoteErrors = {};
          app.configuratorState.submissionResult = res;
          showToast(`Quote request ${res.lead.reference} saved and linked to ${res.configuration.reference}!`);
          renderApp();
        }
      } else if (form.id === 'lead-update-form') {
        const lid = form.getAttribute('data-lead-id');
        const fd = new FormData(form);
        const res = app.store.updateLead(lid, {
          stage: fd.get('stage'),
          owner: fd.get('owner'),
          lossReason: fd.get('lossReason'),
          nextAction: fd.get('nextAction'),
          notes: fd.get('notes')
        });
        if (!res.ok) showToast(res.error, 'error');
        else {
          showToast(`Saved updates for ${res.lead.reference}.`);
          renderApp();
        }
      } else if (form.id === 'catalog-product-form') {
        const fd = new FormData(form);
        const cat = fd.get('category') || 'panel';
        const specVal = Number(fd.get('specValue')) || 580;
        const res = app.store.saveProduct({
          id: fd.get('id') || undefined,
          sku: fd.get('sku'),
          name: fd.get('name'),
          category: cat,
          customerPrice: Number(fd.get('customerPrice')),
          internalUnitCost: Number(fd.get('internalUnitCost')),
          wattage: cat === 'panel' ? specVal : undefined,
          acCapacityKw: cat === 'inverter' ? specVal : undefined,
          capacityKwh: cat === 'battery' ? specVal : undefined,
          warrantyText: fd.get('warrantyText')
        });
        if (!res.ok) showToast(res.error, 'error');
        else {
          app.workspaceState.editingProduct = null;
          showToast(`Saved catalog product ${res.product.sku}.`);
          renderApp();
        }
      } else if (form.id === 'assumptions-settings-form') {
        const fd = new FormData(form);
        const res = app.store.updateAssumptions({
          currency: fd.get('currency'),
          locale: fd.get('locale'),
          regionLabel: fd.get('regionLabel'),
          peakSunHoursPerDay: Number(fd.get('peakSunHoursPerDay')),
          performanceFactor: Number(fd.get('performanceFactor')),
          assumedTariffPerKwh: Number(fd.get('assumedTariffPerKwh')),
          defaultDiscountPercent: Number(fd.get('defaultDiscountPercent')),
          defaultTaxRatePercent: Number(fd.get('defaultTaxRatePercent')),
          discountTiming: fd.get('discountTiming'),
          maxVisiblePanels: Number(fd.get('maxVisiblePanels')),
          disclaimerText: fd.get('disclaimerText')
        });
        if (!res.ok) showToast(res.error, 'error');
        else {
          showToast('Saved estimator assumptions & currency settings.');
          renderApp();
        }
      } else if (form.id === 'proposal-details-form') {
        const pid = form.getAttribute('data-proposal-id');
        const fd = new FormData(form);
        const res = app.store.updateProposal(pid, {
          otherCharges: Number(fd.get('otherCharges')),
          discountPercent: Number(fd.get('discountPercent')),
          taxRatePercent: Number(fd.get('taxRatePercent')),
          amountPaid: Number(fd.get('amountPaid')),
          title: fd.get('title'),
          expiryDate: fd.get('expiryDate'),
          scopeText: fd.get('scopeText'),
          exclusionsText: fd.get('exclusionsText')
        });
        if (!res.ok) showToast(res.error, 'error');
        else {
          showToast(`Saved draft changes for ${res.proposal.reference}.`);
          renderApp();
        }
      } else if (form.id === 'brand-settings-form') {
        const fd = new FormData(form);
        const res = app.store.updateOrganizationSettings({
          name: fd.get('name'),
          tagline: fd.get('tagline'),
          logoType: fd.get('logoType'),
          contactEmail: fd.get('contactEmail'),
          contactPhone: fd.get('contactPhone'),
          publicCtaText: fd.get('publicCtaText'),
          consentCopy: fd.get('consentCopy')
        });
        if (!res.ok) showToast(res.error, 'error');
        else {
          showToast(`Updated white-label brand settings for ${res.organization.name}.`);
          renderApp();
        }
      } else if (form.id === 'new-followup-form') {
        const fd = new FormData(form);
        const res = app.store.createFollowUp({
          title: fd.get('title'),
          type: fd.get('type'),
          dueAt: (fd.get('dueAt') || '2026-10-16') + 'T15:00:00Z',
          leadId: fd.get('leadId'),
          assignedTo: fd.get('assignedTo')
        });
        if (!res.ok) showToast(res.error, 'error');
        else {
          app.workspaceState.activeModal = null;
          showToast('Scheduled new follow-up task.');
          renderApp();
        }
      }
    });

    renderApp();
    return app;
  }

  return {
    initHelioStudioApp
  };
});


if (document.readyState !== 'loading') {
  window.__helioApp = window.HelioApp.initHelioStudioApp();
} else {
  window.addEventListener('DOMContentLoaded', function () {
    window.__helioApp = window.HelioApp.initHelioStudioApp();
  });
}
  </script>
</body>
</html>
